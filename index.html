<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>煮付けラボ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#20231f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;line-height:1.55}main{max-width:720px;margin:auto;padding:24px 14px 100px}.card{background:#fff;border:1px solid #dddcd5;border-radius:18px;padding:16px;margin-top:12px}h1{font-size:34px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}.muted{color:#6c716b;font-size:13px}select,input{width:100%;font-size:16px;padding:13px;border:1px solid #dddcd5;border-radius:12px;background:#fff}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.chip{min-height:52px;border:1px solid #dddcd5;border-radius:12px;background:#fafaf7;text-align:left;padding:0;font-weight:700;display:block;position:relative;overflow:hidden}.chip input{position:absolute;opacity:0;pointer-events:none}.chip span{display:block;padding:9px 10px;min-height:52px}.chip small{display:block;font-size:11px;color:#6c716b;font-weight:500;margin-top:2px}.chip input:checked+span{background:#285f50;color:#fff}.chip input:checked+span small{color:#dce8e3}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:#f4f2ecef;border-top:1px solid #ddd}.bar div{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.clear{min-height:50px;border:0;border-radius:14px;font-size:16px;font-weight:800;padding:0 18px}.primary{background:#285f50;color:#fff}.clear{background:#e5e4df}.result{display:none}.result.show{display:block}.score{font-size:40px;font-weight:900;color:#285f50}.pair,.flavor,.step,.tip{border:1px solid #dddcd5;border-radius:12px;padding:11px;margin-top:8px}.badge{float:right;background:#e8f0ec;color:#285f50;border-radius:999px;padding:3px 8px;font-size:12px}.section{margin-top:18px}.section h3{font-size:14px}.hidden{display:none!important}.tip{background:#fff8e9;border-color:#ead8ad}.tip b{color:#7b5521}.alts{display:flex;gap:7px;overflow:auto;margin-top:8px}.alts span{white-space:nowrap;background:#f3efe6;border-radius:999px;padding:5px 9px;font-size:12px;color:#6a5a43}</style></head><body><main><h1>煮付けラボ</h1><div class="muted">魚と素材から、相性・味方向・煮る順番・仕上げのひと工夫を組み立てます。相性スコア Ver.2／味付け候補 Ver.2／選択UI Ver.3。</div><section class="card"><h2>魚と仕上がり</h2><select id="fish"><option>サバ</option><option>ブリ</option><option>鯛</option><option>タラ</option><option>カレイ</option><option>金目鯛</option><option>鮭</option><option>サワラ</option><option>アジ</option><option>イワシ</option><option>サンマ</option><option>メカジキ</option><option>メバル</option><option>カサゴ</option><option>ヒラメ</option></select><br><br><select id="mood"><option>おまかせ</option><option>さっぱり</option><option>ご飯に合う</option><option>酒に合う</option><option>甘くない</option><option>こってり</option><option>洋風</option></select></section><section class="card"><h2>一緒に煮る素材</h2><input id="search" placeholder="素材を絞り込み"><div class="chips" id="chips"><label class="chip" data-name="大根"><input type="checkbox" name="veg" value="大根"><span>大根<small>吸う</small></span></label><label class="chip" data-name="かぶ"><input type="checkbox" name="veg" value="かぶ"><span>かぶ<small>淡い</small></span></label><label class="chip" data-name="茄子"><input type="checkbox" name="veg" value="茄子"><span>茄子<small>脂を吸う</small></span></label><label class="chip" data-name="白菜"><input type="checkbox" name="veg" value="白菜"><span>白菜<small>甘味</small></span></label><label class="chip" data-name="玉ねぎ"><input type="checkbox" name="veg" value="玉ねぎ"><span>玉ねぎ<small>甘味</small></span></label><label class="chip" data-name="長ねぎ"><input type="checkbox" name="veg" value="長ねぎ"><span>長ねぎ<small>香味</small></span></label><label class="chip" data-name="じゃがいも"><input type="checkbox" name="veg" value="じゃがいも"><span>じゃがいも<small>ボディ</small></span></label><label class="chip" data-name="里芋"><input type="checkbox" name="veg" value="里芋"><span>里芋<small>とろみ</small></span></label><label class="chip" data-name="ごぼう"><input type="checkbox" name="veg" value="ごぼう"><span>ごぼう<small>香り</small></span></label><label class="chip" data-name="れんこん"><input type="checkbox" name="veg" value="れんこん"><span>れんこん<small>食感</small></span></label><label class="chip" data-name="冬瓜"><input type="checkbox" name="veg" value="冬瓜"><span>冬瓜<small>吸う</small></span></label><label class="chip" data-name="豆腐"><input type="checkbox" name="veg" value="豆腐"><span>豆腐<small>吸う</small></span></label><label class="chip" data-name="厚揚げ"><input type="checkbox" name="veg" value="厚揚げ"><span>厚揚げ<small>コク</small></span></label><label class="chip" data-name="トマト"><input type="checkbox" name="veg" value="トマト"><span>トマト<small>酸味・旨味</small></span></label><label class="chip" data-name="きのこ"><input type="checkbox" name="veg" value="きのこ"><span>きのこ<small>旨味</small></span></label><label class="chip" data-name="キャベツ"><input type="checkbox" name="veg" value="キャベツ"><span>キャベツ<small>甘味</small></span></label><label class="chip" data-name="にんじん"><input type="checkbox" name="veg" value="にんじん"><span>にんじん<small>甘味</small></span></label><label class="chip" data-name="セロリ"><input type="checkbox" name="veg" value="セロリ"><span>セロリ<small>香味</small></span></label><label class="chip" data-name="ピーマン"><input type="checkbox" name="veg" value="ピーマン"><span>ピーマン<small>青い香り</small></span></label><label class="chip" data-name="ズッキーニ"><input type="checkbox" name="veg" value="ズッキーニ"><span>ズッキーニ<small>吸う</small></span></label><label class="chip" data-name="ししとう"><input type="checkbox" name="veg" value="ししとう"><span>ししとう<small>香味</small></span></label><label class="chip" data-name="たけのこ"><input type="checkbox" name="veg" value="たけのこ"><span>たけのこ<small>食感</small></span></label><label class="chip" data-name="小松菜"><input type="checkbox" name="veg" value="小松菜"><span>小松菜<small>青菜</small></span></label><label class="chip" data-name="春菊"><input type="checkbox" name="veg" value="春菊"><span>春菊<small>香り</small></span></label><label class="chip" data-name="長芋"><input type="checkbox" name="veg" value="長芋"><span>長芋<small>食感</small></span></label><label class="chip" data-name="こんにゃく"><input type="checkbox" name="veg" value="こんにゃく"><span>こんにゃく<small>食感</small></span></label><label class="chip" data-name="オクラ"><input type="checkbox" name="veg" value="オクラ"><span>オクラ<small>とろみ</small></span></label><label class="chip" data-name="干し椎茸"><input type="checkbox" name="veg" value="干し椎茸"><span>干し椎茸<small>旨味</small></span></label></div><p class="muted">複数選択できます。何も選ばず分析するとおすすめ素材を表示します。</p></section><section class="card result" id="result"><div id="out"></div></section></main><div class="bar"><div><button class="primary" id="go">相性を分析</button><button class="clear" id="clear">クリア</button></div></div><script>const F={"サバ":[5,5,5,3,8],"ブリ":[5,4,4,4,9],"鯛":[2,3,2,4,8],"タラ":[1,2,2,2,7],"カレイ":[2,3,2,5,8],"金目鯛":[4,4,3,5,9],"鮭":[4,4,3,2,8],"サワラ":[3,3,2,2,7],"アジ":[3,4,4,2,7],"イワシ":[4,5,5,3,6],"サンマ":[5,4,5,2,7],"メカジキ":[3,3,2,1,9],"メバル":[2,4,2,5,9],"カサゴ":[2,4,3,5,9],"ヒラメ":[1,3,1,4,7]};const V={"大根":[5,3,3,2,1,18],"かぶ":[4,2,4,2,1,10],"茄子":[5,5,2,2,1,9],"白菜":[5,4,4,2,1,8],"玉ねぎ":[3,3,5,3,3,12],"長ねぎ":[3,3,4,2,4,8],"じゃがいも":[3,3,3,2,1,16],"里芋":[4,3,3,2,1,17],"ごぼう":[3,3,2,3,5,16],"れんこん":[3,2,3,2,2,14],"冬瓜":[5,2,2,1,1,13],"豆腐":[5,3,1,2,1,5],"厚揚げ":[4,4,1,3,2,7],"トマト":[2,2,3,5,4,7],"きのこ":[3,2,1,5,4,6],"キャベツ":[4,4,5,2,1,8],"にんじん":[2,2,5,2,2,15],"セロリ":[2,2,2,2,5,8],"ピーマン":[3,4,2,2,4,5],"ズッキーニ":[4,4,2,2,1,7],"ししとう":[2,3,1,1,4,4],"たけのこ":[2,2,2,3,3,10],"小松菜":[3,3,2,2,2,3],"春菊":[2,2,1,2,5,2],"長芋":[3,2,2,2,1,8],"こんにゃく":[3,1,0,0,1,12],"オクラ":[2,2,1,2,1,3],"干し椎茸":[4,2,2,5,5,12]};const BENCH={"ブリ|大根":97,"鯛|かぶ":95,"サバ|茄子":94,"カレイ|ごぼう":91,"タラ|白菜":91,"タラ|じゃがいも":90,"サバ|トマト":93,"鮭|キャベツ":92,"金目鯛|大根":96,"メバル|豆腐":92,"カサゴ|大根":93,"サワラ|かぶ":91,"アジ|茄子":91,"イワシ|トマト":92,"サンマ|大根":92,"メカジキ|トマト":90,"鯛|冬瓜":93,"鯛|白菜":90,"ブリ|ごぼう":92,"ブリ|里芋":91,"カレイ|豆腐":93,"鮭|じゃがいも":91,"タラ|きのこ":90,"サバ|大根":91,"ヒラメ|かぶ":92};const flavors=[{name:"王道・甘辛醤油",desc:"醤油・酒・みりん・砂糖。煮汁を素材に含ませる基準の味。",rice:5,sake:4,light:1,nosweet:1,rich:4,west:0,jp:5,sweet:5,fishFat:4,fishAroma:3,absorb:5},{name:"甘さ控えめ・醤油酒生姜",desc:"醤油・酒・生姜を軸に甘味を控え、魚と野菜の味を前に出す。",rice:5,sake:5,light:3,nosweet:5,rich:2,west:0,jp:5,sweet:1,fishFat:4,fishAroma:5,absorb:4},{name:"生姜強め・甘辛醤油",desc:"王道の甘辛に生姜を強めに効かせ、脂や青魚の香りを整える。",rice:5,sake:5,light:2,nosweet:2,rich:4,west:0,jp:5,sweet:4,fishFat:5,fishAroma:5,absorb:4},{name:"塩・酒・柑橘",desc:"魚の出汁を前に出し、最後の酸味で締める。",rice:2,sake:4,light:5,nosweet:5,rich:1,west:2,jp:5,sweet:0,fishFat:3,fishAroma:2,absorb:3},{name:"黒酢・生姜・醤油",desc:"脂を黒酢で切り、生姜で香りを整える。",rice:5,sake:5,light:4,nosweet:4,rich:3,west:0,jp:4,sweet:1,fishFat:5,fishAroma:5,absorb:5},{name:"味噌・生姜",desc:"旨味とコクを足し、根菜・豆腐・葉物にも味を渡す。",rice:5,sake:4,light:1,nosweet:2,rich:5,west:0,jp:5,sweet:2,fishFat:4,fishAroma:4,absorb:4},{name:"トマト・白だし",desc:"酸味と旨味を重ね、魚の脂を軽くまとめる。",rice:3,sake:4,light:3,nosweet:4,rich:3,west:5,jp:2,sweet:2,fishFat:4,fishAroma:3,absorb:3},{name:"薄口醤油・昆布・山椒",desc:"繊細な白身を壊さず、旨味と香りを補う。",rice:4,sake:5,light:5,nosweet:4,rich:2,west:0,jp:5,sweet:1,fishFat:2,fishAroma:2,absorb:4},{name:"白ワイン・玉ねぎ・ハーブ",desc:"魚から出た煮汁を白ワインと香味野菜で洋風に育てる。",rice:1,sake:4,light:3,nosweet:4,rich:3,west:5,jp:0,sweet:2,fishFat:3,fishAroma:2,absorb:3}];const A=[{name:"生姜",note:"魚の香りを整え、煮汁に芯を作る。",jp:5,west:1,cut:4,fishy:5},{name:"粉山椒",note:"脂の後味を軽くし、甘辛い煮汁に輪郭を出す。",jp:5,west:1,cut:4,fishy:3},{name:"柚子皮",note:"香りを持ち上げ、重さを残さず余韻を作る。",jp:5,west:2,cut:5,fishy:2},{name:"大葉",note:"青魚や濃い煮汁に爽やかな青い香りを加える。",jp:5,west:1,cut:3,fishy:4},{name:"みょうが",note:"甘辛さや脂を軽く感じさせる。",jp:5,west:1,cut:3,fishy:4},{name:"柚子胡椒",note:"脂とコクを切り、柑橘香と辛味を足す。",jp:5,west:1,cut:5,fishy:4},{name:"黒胡椒",note:"洋風・トマト系に辛味と輪郭を足す。",jp:2,west:5,cut:3,fishy:2},{name:"ディル",note:"タラ・鮭・じゃがいも系を軽やかにする。",jp:1,west:5,cut:2,fishy:2},{name:"タイム",note:"トマトや玉ねぎを使う洋風煮に奥行きを足す。",jp:1,west:5,cut:2,fishy:2}];const fish=document.getElementById("fish"),mood=document.getElementById("mood"),chips=document.getElementById("chips"),result=document.getElementById("result"),out=document.getElementById("out");function rawScore(f,v){let s=43;s+=16*f[0]/5*v[1]/5+15*f[1]/5*v[0]/5+8*(6-f[1])/5*v[3]/5+7*f[2]/5*v[2]/5+6*f[3]/5*v[0]/5;return Math.min(98,s)}function sim(a,b,sc){let d=0;for(let i=0;i<a.length;i++)d+=Math.pow((a[i]-b[i])/sc[i],2);return Math.exp(-d/2)}function score(n){const fn=fish.value,key=fn+"|"+n;if(BENCH[key])return BENCH[key];const f=F[fn],v=V[n],raw=rawScore(f,v),near=[];Object.entries(BENCH).forEach(([k,target])=>{const [af,av]=k.split("|"),sf=sim(f,F[af],[4,4,4,4,10]),sv=sim(v.slice(0,6),V[av].slice(0,6),[5,5,5,5,5,18]),w=Math.pow(sf*sv,.7),res=target-rawScore(F[af],V[av]);near.push([w,res])});near.sort((a,b)=>b[0]-a[0]);const top=near.slice(0,5),ws=top.reduce((z,x)=>z+x[0],0)||1,corr=top.reduce((z,x)=>z+x[0]*x[1],0)/ws;return Math.max(45,Math.min(97,Math.round(raw+.75*corr)))}function why(n){let f=F[fish.value],v=V[n],a=[];if(f[0]>=4&&v[1]>=4)a.push(n+"が魚の脂と煮汁を受け止める");if(f[1]>=4&&v[0]>=4)a.push("魚の旨味を"+n+"に含ませやすい");if(f[1]<=2&&v[3]>=4)a.push(n+"から旨味を補える");if(f[2]>=4&&v[2]>=4)a.push(n+"の甘味が魚の強い香りを丸くする");if(f[3]>=4&&v[0]>=4)a.push("ゼラチン質を含む煮汁を抱え込める");return(a[0]||"煮汁を介して味を一体化しやすい")+"。"}function flavorScore(x,f,a){const vs=a.map(n=>V[n]),avg=k=>vs.reduce((z,v)=>z+v[k],0)/Math.max(1,vs.length);let s=f[0]*x.fishFat*1.2+f[2]*x.fishAroma+avg(0)*x.absorb*.9;const m=mood.value;if(x.name==="王道・甘辛醤油")s+=avg(0)*2.5+f[1]*1.6+f[3]*1.2;if(x.name==="甘さ控えめ・醤油酒生姜"&&avg(2)>=4)s+=6;if(x.name==="生姜強め・甘辛醤油"&&f[2]>=4)s+=10;if(m==="さっぱり")s+=x.light*5;else if(m==="ご飯に合う")s+=x.rice*5;else if(m==="酒に合う")s+=x.sake*5;else if(m==="甘くない")s+=x.nosweet*6-x.sweet*3;else if(m==="こってり")s+=x.rich*5;else if(m==="洋風")s+=x.west*7-x.jp*1.5;else s+=x.jp*1.2+x.rice*.8;return s}function pickFlavors(f,a){return flavors.map(x=>[x,flavorScore(x,f,a)]).sort((p,q)=>q[1]-p[1]).slice(0,3).map(x=>x[0])}function tipScore(x,f,flav){let s=f[0]*x.cut*1.4+f[2]*x.fishy*1.3;if(flav.west>=4)s+=x.west*3;else s+=x.jp*2;if(mood.value==="さっぱり"||mood.value==="甘くない")s+=x.cut*3;return s}function analyze(){let a=[...document.querySelectorAll('input[name="veg"]:checked')].map(x=>x.value);if(!a.length)a=Object.keys(V).sort((x,y)=>score(y)-score(x)).slice(0,8);let total=Math.round(a.reduce((s,n)=>s+score(n),0)/a.length),f=F[fish.value],long=a.filter(n=>V[n][5]>=f[4]+4),short=a.filter(n=>V[n][5]<=f[4]-2),flav=pickFlavors(f,a);let tips=A.map(x=>[x,tipScore(x,f,flav[0])]).sort((p,q)=>q[1]-p[1]).slice(0,3),best=tips[0][0];out.innerHTML='<div class="score">'+total+' / 100</div><b>'+fish.value+" × "+a.join(" × ")+'</b><div class="section"><h3>素材ごとの相性</h3>'+a.map(n=>'<div class="pair"><span class="badge">'+score(n)+"点</span><b>"+fish.value+" × "+n+'</b><div class="muted">'+why(n)+"</div></div>").join("")+'</div><div class="section"><h3>味付け候補</h3>'+flav.map((x,i)=>'<div class="flavor"><b>第'+(i+1)+"候補　"+x.name+'</b><div class="muted">'+x.desc+"</div></div>").join("")+'</div><div class="section"><h3>💡 ワンポイント</h3><div class="tip"><b>'+best.name+" を仕上げに</b><div>"+best.note+'</div><div class="muted">この組み合わせと「'+flav[0].name+'」方向に合わせた提案です。</div><div class="alts"><span>別案 '+tips[1][0].name+"</span><span>別案 "+tips[2][0].name+"</span></div></div></div><div class="section"><h3>煮る順番</h3>"+(long.length?'<div class="step"><b>1. 野菜を先に</b><div class="muted">'+long.join("・")+"を薄い煮汁で先行加熱。</div></div>":"")+'<div class="step"><b>魚を入れる</b><div class="muted">強く沸騰させ続けず約'+f[4]+"分。魚から旨味を煮汁へ出す。</div></div>"+(short.length?'<div class="step"><b>火の早い素材は後半</b><div class="muted">'+short.join("・")+"は香りや食感を残す。</div></div>":"")+'<div class="step"><b>魚を先に取り出す</b><div class="muted">魚の火入れを止め、残った素材と煮汁だけを仕上げる。</div></div><div class="step"><b>煮汁を完成</b><div class="muted">煮詰める・酸味を足す・味噌を溶くなどして、魚自身の出汁をソース化する。</div></div></div>';result.classList.add("show");result.scrollIntoView({behavior:"smooth"})}document.getElementById("go").onclick=analyze;document.getElementById("clear").onclick=()=>{document.querySelectorAll('input[name="veg"]').forEach(x=>x.checked=false);result.classList.remove("show")};document.getElementById("search").oninput=e=>document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("hidden",!b.textContent.includes(e.target.value)));</script></body></html>
