,"中盤","甘辛・発酵"],"味噌":[5,2,1,4,4,4,1,5,1,1,"後半","旨味・発酵"],"白味噌":[4,5,1,3,3,3,1,5,1,1,"後半","甘味・発酵"],"酒粕":[4,3,2,5,1,5,1,5,1,1,"後半","発酵・香り"],"甘酒":[3,5,1,2,1,3,1,5,1,1,"中盤","甘味・発酵"],"ナンプラー":[5,1,1,5,5,5,2,1,5,1,"中盤少量","魚醤・発酵"],"オイスターソース":[5,3,1,4,4,2,1,1,4,1,"中盤少量","旨味・コク"],"ココナッツミルク":[2,4,1,4,0,0,1,1,5,2,"後半","コク・甘い香り"],"ヨーグルト":[2,2,4,3,0,3,3,1,2,4,"後半弱火","酸味・乳酸"],"あさり":[5,1,1,4,2,0,1,2,3,5,"前半","貝旨味"],"しじみ":[5,1,1,3,2,0,1,4,2,3,"前半","貝旨味"],"桜えび":[5,2,0,5,2,0,1,4,3,2,"前半少量","甲殻類旨味"],"干しえび":[5,1,0,5,4,0,1,2,5,2,"前半少量","甲殻類旨味"],"わかめ":[3,1,0,3,2,1,1,5,2,1,"後半","海藻旨味"],"ひじき":[3,1,1,3,3,0,1,5,1,1,"中盤","海藻・食感"],"もずく":[2,1,4,2,2,2,4,4,2,1,"仕上げ","酸味・海藻"],"めかぶ":[3,1,1,3,2,1,1,5,2,1,"仕上げ","海藻・とろみ"]};var G={"海苔":[1,3,5,0,0,2,5,2,1,"仕上げ","磯香・旨味"],"とろろ昆布":[1,2,3,0,1,3,5,1,1,"仕上げ","旨味・とろみ"],"青のり":[1,3,5,0,0,1,5,2,1,"仕上げ","磯香"],"青ねぎ":[2,4,4,1,0,3,5,3,1,"仕上げ","青い香り"],"大葉":[3,5,5,0,0,2,5,2,1,"仕上げ","爽やか"],"みょうが":[4,5,5,1,0,3,5,3,1,"仕上げ","爽やか・辛味"],"三つ葉":[2,4,5,0,0,2,5,1,1,"仕上げ","和の香り"],"柚子皮":[3,5,5,0,2,1,5,2,2,"仕上げ","柑橘香"],"すだち":[5,5,4,0,5,1,5,2,1,"仕上げ","酸味・柑橘"],"レモン":[5,5,4,0,5,1,2,3,5,"仕上げ","酸味・柑橘"],"ライム":[5,5,5,0,5,1,1,5,3,"仕上げ","酸味・柑橘"],"オレンジ皮":[2,4,5,0,2,1,1,2,5,"仕上げ","甘い柑橘香"],"パクチー":[2,5,5,0,0,2,1,5,1,"仕上げ","アジアン香"],"ミント":[4,5,5,0,0,2,1,5,3,"仕上げ","清涼感"],"タイバジル":[2,4,5,1,0,2,1,5,3,"仕上げ","甘い香り"],"ディル":[3,5,5,0,0,2,1,2,5,"仕上げ","ハーブ"],"タイム":[1,3,5,0,0,1,1,1,5,"仕上げ少量","ハーブ"],"パセリ":[1,4,4,0,0,2,1,1,5,"仕上げ","ハーブ"],"粉山椒":[4,3,5,4,0,1,5,2,1,"仕上げ","痺れ・香り"],"花椒":[4,3,5,5,0,1,1,5,1,"仕上げ","痺れ・香り"],"黒胡椒":[2,2,4,4,0,1,1,2,5,"仕上げ","辛味・香り"],"白胡椒":[1,2,3,3,0,1,2,3,4,"仕上げ","辛味"],"唐辛子":[3,2,3,5,0,1,3,5,2,"仕上げ/中盤","辛味"],"七味":[3,3,5,4,0,2,5,2,1,"仕上げ","複合香辛料"],"クミン":[2,2,5,1,0,1,1,4,4,"仕上げ少量","スパイス"],"白ごま":[1,1,3,0,0,4,4,3,1,"仕上げ","香ばしさ"],"フライドオニオン":[1,1,4,0,0,5,1,5,4,"仕上げ","香ばしさ・食感"]};var A={"ブリ|大根":97,"鯛|かぶ":95,"サバ|茄子":94,"タラ|白菜":91,"タラ|じゃがいも":90,"鮭|キャベツ":92,"金目鯛|大根":96,"メバル|豆腐":92,"カサゴ|大根":93,"サワラ|かぶ":91,"アジ|茄子":91,"サンマ|大根":92,"鯛|冬瓜":93,"鯛|白菜":90,"ブリ|里芋":91,"カレイ|豆腐":93,"鮭|じゃがいも":91,"サバ|大根":91,"ヒラメ|かぶ":92};var FL=[["王道・甘辛醤油","醤油・酒・みりん・砂糖。魚の旨味を受けた煮汁を素材に含ませる基準の味。","jp"],["甘さ控えめ・醤油酒生姜","醤油・酒・生姜を軸に甘味を控える。","jp"],["生姜強め・甘辛醤油","王道甘辛に生姜を強めに効かせる。","jp"],["塩・酒・柑橘","魚の出汁を前に出し、最後の酸味で締める。","light"],["黒酢・生姜・醤油","脂を黒酢で切り、生姜で香りを整える。","light"],["味噌・生姜","旨味とコクを足し、根菜や豆腐にも味を渡す。","rich"],["トマト・白だし","酸味と旨味を重ね、魚の脂を軽くまとめる。","west"],["薄口醤油・昆布・山椒","繊細な白身を壊さず旨味と香りを補う。","light"],["白ワイン・玉ねぎ・ハーブ","魚の煮汁を白ワインと香味野菜で洋風に育てる。","west"],["ナンプラー・ライム・生姜","魚醤の発酵旨味を重ね、ライムと生姜で軽く締める。","asian"],["ナンプラー・黒糖・唐辛子","ナンプラーに少量の黒糖と唐辛子。甘辛を東南アジア方向へ。","asian"],["ナンプラー・トマト・レモングラス","トマトの酸味と魚醤の旨味、レモングラスの香り。","asian"],["ナンプラー・ココナッツミルク","魚醤の塩味と魚の旨味をココナッツミルクで包む。","asian"]];var fish=document.getElementById('fish'),mood=document.getElementById('mood'),result=document.getElementById('result'),out=document.getElementById('out');function fill(id,d,n){var h='',k,v;for(k in d){v=d[k];h+='<label class="chip"><input type="checkbox" name="'+n+'" value="'+k+'"><span>'+k+'<small>'+v[v.length-1]+'</small></span></label>'}document.getElementById(id).innerHTML=h}fill('r',R,'receive');fill('b',B,'build');fill('g',G,'finish');function vals(n){var a=[],x=document.querySelectorAll('input[name="'+n+'"]:checked'),i;for(i=0;i<x.length;i++)a.push(x[i].value);return a}function rs(n){var f=F[fish.value],v=R[n],k=fish.value+'|'+n;if(A[k])return A[k];return Math.max(50,Math.min(96,Math.round(59+16*f[0]/5*v[1]/5+15*f[1]/5*v[0]/5+8*(6-f[1])/5*v[3]/5+7*f[2]/5*v[2]/5+6*f[3]/5*v[0]/5)))}function bs(n){var f=F[fish.value],x=B[n],m=mood.value,s=46+(6-f[1])*x[0]*1.1+f[2]*x[3]*.8+f[0]*(x[2]+x[6])*.8+x[1]*.6+x[5]*1.3;if(m==='アジアン')s+=x[8]*4;if(m==='洋風')s+=x[9]*4;if(m==='ご飯に合う'||m==='おまかせ')s+=x[7]*2;if(m==='さっぱり'||m==='甘くない')s+=x[2]*2+x[6]*2;return Math.max(50,Math.min(98,Math.round(s)))}function gs(n){var f=F[fish.value],x=G[n],m=mood.value,s=48+f[0]*(x[0]+x[4])*.7+f[2]*x[2]*.7+x[1]*1.5+x[3]*.8+x[5]*.5;if(m==='アジアン')s+=x[7]*4;if(m==='洋風')s+=x[8]*4;if(m==='ご飯に合う'||m==='おまかせ')s+=x[6]*2;if(m==='さっぱり')s+=x[0]*2+x[1]*2+x[4]*2;return Math.max(50,Math.min(98,Math.round(s)))}function fl(rs1,bs1,gs1){var a=FL.slice(),m=mood.value;function p(x){var s=0;if(m==='アジアン'&&x[2]==='asian')s+=100;if(m==='洋風'&&x[2]==='west')s+=100;if(m==='さっぱり'&&(x[2]==='light'||x[2]==='asian'))s+=60;if(m==='こってり'&&x[2]==='rich')s+=80;if(m==='ご飯に合う'&&x[2]==='jp')s+=60;if(m==='酒に合う'&&(x[2]==='light'||x[2]==='asian'))s+=45;if(m==='甘くない'&&x[0].indexOf('甘辛')<0&&x[0].indexOf('黒糖')<0)s+=50;if(m==='おまかせ'&&x[2]==='jp')s+=20;if(bs1.indexOf('トマト')>=0&&(x[2]==='west'||x[2]==='asian'))s+=30;if(bs1.indexOf('ナンプラー')>=0&&x[2]==='asian')s+=50;if(bs1.indexOf('キムチ')>=0&&x[2]==='asian')s+=35;if(bs1.indexOf('味噌')>=0&&x[2]==='rich')s+=35;if(bs1.indexOf('昆布')>=0&&x[2]==='light')s+=25;if(gs1.indexOf('ライム')>=0&&x[2]==='asian')s+=30;if(gs1.indexOf('柚子皮')>=0&&x[2]==='light')s+=20;return s}return a.sort(function(x,y){return p(y)-p(x)}).slice(0,3)}function analyze(){try{var r=vals('receive'),b=vals('build'),g=vals('finish'),i;if(!r.length&&!b.length&&!g.length){r=Object.keys(R).sort(function(x,y){return rs(y)-rs(x)}).slice(0,6)}var ra=r.length?Math.round(r.reduce(function(s,n){return s+rs(n)},0)/r.length):0,ba=b.length?Math.round(b.reduce(function(s,n){return s+bs(n)},0)/b.length):0,ga=g.length?Math.round(g.reduce(function(s,n){return s+gs(n)},0)/g.length):0,total=Math.max(50,Math.min(99,(ra||82)+Math.round((ba?ba-80:0)*.28)+Math.round((ga?ga-80:0)*.18))),f=fl(r,b,g),cook=F[fish.value][4],early=r.filter(function(n){return R[n][5]>=cook+4}),late=r.filter(function(n){return R[n][5]<=cook-2});out.innerHTML='<div class="score">'+total+' / 100</div><b>'+fish.value+(r.length?' × '+r.join(' × '):'')+(b.length?' ＋ '+b.join(' ＋ '):'')+(g.length?' ／ '+g.join('・'):'')+'</b><div class="scores"><div class="mini"><b>'+(ra||'—')+'</b><small>受ける</small></div><div class="mini"><b>'+(ba||'—')+'</b><small>作る</small></div><div class="mini"><b>'+(ga||'—')+'</b><small>仕上げ</small></div></div><div class="sec"><h3>① 煮汁を受ける</h3>'+(r.length?r.map(function(n){return'<div class="item"><span class="badge">'+rs(n)+
