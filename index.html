<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>煮付けラボ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#20231f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;line-height:1.55}main{max-width:720px;margin:auto;padding:24px 14px 100px}.card{background:#fff;border:1px solid #dddcd5;border-radius:18px;padding:16px;margin-top:12px}h1{font-size:34px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}.muted{color:#6c716b;font-size:13px}select,input{width:100%;font-size:16px;padding:13px;border:1px solid #dddcd5;border-radius:12px;background:#fff}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.chip{min-height:48px;border:1px solid #dddcd5;border-radius:12px;background:#fafaf7;text-align:left;padding:9px;font-weight:700}.chip.on{background:#285f50;color:#fff}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:#f4f2ecef;border-top:1px solid #ddd}.bar div{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.clear{min-height:50px;border:0;border-radius:14px;font-size:16px;font-weight:800;padding:0 18px}.primary{background:#285f50;color:#fff}.clear{background:#e5e4df}.result{display:none}.result.show{display:block}.score{font-size:40px;font-weight:900;color:#285f50}.pair,.flavor,.step,.tip{border:1px solid #dddcd5;border-radius:12px;padding:11px;margin-top:8px}.badge{float:right;background:#e8f0ec;color:#285f50;border-radius:999px;padding:3px 8px;font-size:12px}.section{margin-top:18px}.section h3{font-size:14px}.hidden{display:none!important}.tip{background:#fff8e9;border-color:#ead8ad}.tip b{color:#7b5521}.alts{display:flex;gap:7px;overflow:auto;margin-top:8px}.alts span{white-space:nowrap;background:#f3efe6;border-radius:999px;padding:5px 9px;font-size:12px;color:#6a5a43}</style></head><body><main><h1>煮付けラボ</h1><div class="muted">魚と素材から、相性・味方向・煮る順番・仕上げのひと工夫を組み立てます。</div><section class="card"><h2>魚と仕上がり</h2><select id="fish"><option>サバ</option><option>ブリ</option><option>鯛</option><option>タラ</option><option>カレイ</option><option>金目鯛</option><option>鮭</option><option>サワラ</option><option>アジ</option><option>イワシ</option><option>サンマ</option><option>メカジキ</option><option>メバル</option><option>カサゴ</option><option>ヒラメ</option></select><br><br><select id="mood"><option>おまかせ</option><option>さっぱり</option><option>ご飯に合う</option><option>酒に合う</option><option>甘くない</option><option>こってり</option><option>洋風</option></select></section><section class="card"><h2>一緒に煮る素材</h2><input id="search" placeholder="素材を絞り込み"><div class="chips" id="chips"></div><p class="muted">複数選択できます。何も選ばず分析するとおすすめ素材を表示します。</p></section><section class="card result" id="result"><div id="out"></div></section></main><div class="bar"><div><button class="primary" id="go">相性を分析</button><button class="clear" id="clear">クリア</button></div></div><script>const F={"サバ":[5,5,5,3,8],"ブリ":[5,4,4,4,9],"鯛":[2,3,2,4,8],"タラ":[1,2,2,2,7],"カレイ":[2,3,2,5,8],"金目鯛":[4,4,3,5,9],"鮭":[4,4,3,2,8],"サワラ":[3,3,2,2,7],"アジ":[3,4,4,2,7],"イワシ":[4,5,5,3,6],"サンマ":[5,4,5,2,7],"メカジキ":[3,3,2,1,9],"メバル":[2,4,2,5,9],"カサゴ":[2,4,3,5,9],"ヒラメ":[1,3,1,4,7]};const V={"大根":[5,3,3,2,1,18,"吸う"],"かぶ":[4,2,4,2,1,10,"淡い"],"茄子":[5,5,2,2,1,9,"脂を吸う"],"白菜":[5,4,4,2,1,8,"甘味"],"玉ねぎ":[3,3,5,3,3,12,"甘味"],"長ねぎ":[3,3,4,2,4,8,"香味"],"じゃがいも":[3,3,3,2,1,16,"ボディ"],"里芋":[4,3,3,2,1,17,"とろみ"],"ごぼう":[3,3,2,3,5,16,"香り"],"れんこん":[3,2,3,2,2,14,"食感"],"冬瓜":[5,2,2,1,1,13,"吸う"],"豆腐":[5,3,1,2,1,5,"吸う"],"厚揚げ":[4,4,1,3,2,7,"コク"],"トマト":[2,2,3,5,4,7,"酸味・旨味"],"きのこ":[3,2,1,5,4,6,"旨味"],"キャベツ":[4,4,5,2,1,8,"甘味"],"にんじん":[2,2,5,2,2,15,"甘味"],"セロリ":[2,2,2,2,5,8,"香味"],"ピーマン":[3,4,2,2,4,5,"青い香り"],"ズッキーニ":[4,4,2,2,1,7,"吸う"],"ししとう":[2,3,1,1,4,4,"香味"],"たけのこ":[2,2,2,3,3,10,"食感"],"小松菜":[3,3,2,2,2,3,"青菜"],"春菊":[2,2,1,2,5,2,"香り"],"長芋":[3,2,2,2,1,8,"食感"],"こんにゃく":[3,1,0,0,1,12,"食感"],"オクラ":[2,2,1,2,1,3,"とろみ"],"干し椎茸":[4,2,2,5,5,12,"旨味"]};const flavors=[["塩・酒・柑橘","魚の出汁を前に出し、最後の酸味で締める。"],["黒酢・生姜・醤油","脂を酸味で切り、生姜で香りを整える。"],["味噌・生姜","旨味とコクを足し、根菜や豆腐にも味を渡す。"],["トマト・白だし","酸味と旨味を重ね、魚の脂を軽くまとめる。"],["薄口醤油・昆布・山椒","繊細な白身を壊さず、旨味と香りを補う。"],["白ワイン・玉ねぎ・ハーブ","魚から出た煮汁を洋風に育てる。"]];const A=[{name:"生姜",cut:4,fishy:5,fresh:2,hot:3,jp:5,west:1,green:1,rich:2,note:"魚の香りを整え、煮汁に芯を作る。"},{name:"粉山椒",cut:4,fishy:3,fresh:4,hot:4,jp:5,west:1,green:2,rich:2,note:"脂の後味を軽くし、煮汁の甘辛さに輪郭を出す。"},{name:"木の芽",cut:2,fishy:2,fresh:5,hot:1,jp:5,west:1,green:5,rich:1,note:"繊細な白身やかぶ系に、青い香りだけを上品に足す。"},{name:"柚子皮",cut:5,fishy:2,fresh:5,hot:1,jp:5,west:2,green:2,rich:1,note:"香りを持ち上げ、重さを残さず余韻を作る。"},{name:"すだち",cut:5,fishy:2,fresh:5,hot:1,jp:5,west:2,green:2,rich:1,note:"脂を切り、煮汁の塩味と旨味をシャープにする。"},{name:"大葉",cut:3,fishy:4,fresh:5,hot:1,jp:5,west:1,green:5,rich:1,note:"青魚や濃い煮汁に、爽やかな青い香りを加える。"},{name:"みょうが",cut:3,fishy:4,fresh:5,hot:2,jp:5,west:1,green:5,rich:1,note:"甘辛さや脂を軽く感じさせ、夏向きにする。"},{name:"白髪ねぎ",cut:2,fishy:3,fresh:3,hot:2,jp:5,west:1,green:3,rich:2,note:"濃い味に生の辛味と食感を足して締める。"},{name:"青ねぎ",cut:2,fishy:3,fresh:4,hot:1,jp:5,west:1,green:4,rich:1,note:"煮汁の香りを軽く持ち上げ、見た目も締める。"},{name:"三つ葉",cut:2,fishy:2,fresh:5,hot:1,jp:5,west:1,green:5,rich:1,note:"淡い煮汁に清涼感を足し、白身魚を邪魔しない。"},{name:"わさび",cut:4,fishy:3,fresh:4,hot:5,jp:5,west:1,green:2,rich:1,note:"甘さを抑えたい時に、食べる直前の辛味で締める。"},{name:"柚子胡椒",cut:5,fishy:4,fresh:4,hot:5,jp:5,west:1,green:2,rich:2,note:"脂とコクを切りつつ、塩味と柑橘香を同時に足す。"},{name:"黒胡椒",cut:3,fishy:2,fresh:2,hot:4,jp:2,west:5,green:1,rich:3,note:"洋風やトマト系の煮汁に、辛味と香ばしい輪郭を足す。"},{name:"花椒",cut:4,fishy:3,fresh:3,hot:5,jp:1,west:1,green:1,rich:3,note:"脂の強い魚に痺れと香りを足し、中華寄りに振れる。"},{name:"八角",cut:2,fishy:4,fresh:1,hot:1,jp:1,west:1,green:1,rich:5,note:"青魚や濃い醤油煮に甘い香りを重ね、奥行きを出す。"},{name:"唐辛子",cut:3,fishy:2,fresh:2,hot:5,jp:3,west:2,green:1,rich:3,note:"甘さや脂に対して辛味の軸を作る。"},{name:"クミン",cut:3,fishy:3,fresh:2,hot:2,jp:1,west:4,green:1,rich:4,note:"青魚やトマト煮を一気にスパイス方向へ展開する。"},{name:"コリアンダー",cut:3,fishy:2,fresh:5,hot:1,jp:1,west:4,green:5,rich:1,note:"酸味のある煮汁に青い香りを足し、軽やかにする。"},{name:"ディル",cut:2,fishy:2,fresh:5,hot:1,jp:1,west:5,green:5,rich:1,note:"タラ・鮭・じゃがいも系に清涼感を足す。"},{name:"タイム",cut:2,fishy:2,fresh:3,hot:1,jp:1,west:5,green:3,rich:3,note:"トマトや玉ねぎと合わせた洋風煮に奥行きを足す。"},{name:"ローズマリー",cut:2,fishy:3,fresh:2,hot:1,jp:1,west:5,green:2,rich:4,note:"脂のある魚とじゃがいも系を力強い香りでまとめる。"},{name:"パセリ",cut:2,fishy:1,fresh:4,hot:1,jp:1,west:5,green:4,rich:1,note:"洋風の煮汁を軽く仕上げ、色も整える。"}];const sel=new Set,fish=document.getElementById("fish"),mood=document.getElementById("mood"),chips=document.getElementById("chips"),result=document.getElementById("result"),out=document.getElementById("out");Object.entries(V).forEach(([n,v])=>{let b=document.createElement("button");b.className="chip";b.innerHTML=n+'<div class="muted">'+v[6]+"</div>";b.onclick=()=>{sel.has(n)?sel.delete(n):sel.add(n);b.classList.toggle("on")};chips.appendChild(b)});function score(n){let f=F[fish.value],v=V[n],s=43;s+=16*f[0]/5*v[1]/5+15*f[1]/5*v[0]/5+8*(6-f[1])/5*v[3]/5+7*f[2]/5*v[2]/5+6*f[3]/5*v[0]/5;return Math.min(98,Math.round(s))}function why(n){let f=F[fish.value],v=V[n],a=[];if(f[0]>=4&&v[1]>=4)a.push(n+"が魚の脂と煮汁を受け止める");if(f[1]>=4&&v[0]>=4)a.push("魚の旨味を"+n+"に含ませやすい");if(f[1]<=2&&v[3]>=4)a.push(n+"から旨味を補える");if(f[2]>=4&&v[2]>=4)a.push(n+"の甘味が魚の強い香りを丸くする");if(f[3]>=4&&v[0]>=4)a.push("ゼラチン質を含む煮汁を抱え込める");return(a[0]||"煮汁を介して味を一体化しやすい")+"。"}function pickFlavors(f){if(f[0]>=4)return[flavors[1],flavors[3],flavors[2]];if(f[1]<=2)return[flavors[4],flavors[0],flavors[2]];return[flavors[4],flavors[0],flavors[3]]}function tipScore(x,f,a,flav){let s=0,vs=a.map(n=>V[n]),avg=k=>vs.reduce((z,v)=>z+v[k],0)/Math.max(1,vs.length);s+=f[0]*x.cut*1.4+f[2]*x.fishy*1.3;if(avg(2)>=4)s+=x.fresh*2;if(avg(4)>=4)s+=x.green*1.6;if(["塩・酒・柑橘","薄口醤油・昆布・山椒"].includes(flav[0]))s+=x.jp*2+x.fresh;if(["トマト・白だし","白ワイン・玉ねぎ・ハーブ"].includes(flav[0]))s+=x.west*2+x.fresh;if(mood.value==="洋風")s+=x.west*4;if(mood.value==="さっぱり"||mood.value==="甘くない")s+=x.cut*3+x.fresh*2;if(mood.value==="こってり")s+=x.rich*3+x.hot;if(mood.value==="酒に合う")s+=x.hot*2+x.fishy;if(mood.value==="ご飯に合う")s+=x.jp*2+x.hot;return s}function analyze(){let a=[...sel];if(!a.length)a=Object.keys(V).sort((x,y)=>score(y)-score(x)).slice(0,8);let total=Math.round(a.reduce((s,n)=>s+score(n),0)/a.length),f=F[fish.value],long=a.filter(n=>V[n][5]>=f[4]+4),short=a.filter(n=>V[n][5]<=f[4]-2),flav=pickFlavors(f);let tips=A.map(x=>[x,tipScore(x,f,a,flav[0])]).sort((p,q)=>q[1]-p[1]).slice(0,3),best=tips[0][0];out.innerHTML='<div class="score">'+total+' / 100</div><b>'+fish.value+" × "+a.join(" × ")+'</b><div class="section"><h3>素材ごとの相性</h3>'+a.map(n=>'<div class="pair"><span class="badge">'+score(n)+"点</span><b>"+fish.value+" × "+n+'</b><div class="muted">'+why(n)+"</div></div>").join("")+'</div><div class="section"><h3>味付け候補</h3>'+flav.map((x,i)=>'<div class="flavor"><b>第'+(i+1)+"候補　"+x[0]+'</b><div class="muted">'+x[1]+"</div></div>").join("")+'</div><div class="section"><h3>💡 ワンポイント</h3><div class="tip"><b>'+best.name+" を仕上げに</b><div>"+best.note+'</div><div class="muted">この組み合わせと「'+flav[0][0]+'」方向に合わせた提案です。</div><div class="alts"><span>別案 '+tips[1][0].name+"</span><span>別案 "+tips[2][0].name+'</span></div></div></div><div class="section"><h3>煮る順番</h3>'+(long.length?'<div class="step"><b>1. 野菜を先に</b><div class="muted">'+long.join("・")+"を薄い煮汁で先行加熱。</div></div>":"")+'<div class="step"><b>魚を入れる</b><div class="muted">強く沸騰させ続けず約'+f[4]+"分。魚から旨味を煮汁へ出す。</div></div>"+(short.length?'<div class="step"><b>火の早い素材は後半</b><div class="muted">'+short.join("・")+"は香りや食感を残す。</div></div>":"")+'<div class="step"><b>魚を先に取り出す</b><div class="muted">魚の火入れを止め、残った素材と煮汁だけを仕上げる。</div></div><div class="step"><b>煮汁を完成</b><div class="muted">煮詰める・酸味を足す・味噌を溶くなどして、魚自身の出汁をソース化する。</div></div></div>';result.classList.add("show");result.scrollIntoView({behavior:"smooth"})}document.getElementById("go").onclick=analyze;document.getElementById("clear").onclick=()=>{sel.clear();document.querySelectorAll(".chip").forEach(b=>b.classList.remove("on"));result.classList.remove("show")};document.getElementById("search").oninput=e=>document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("hidden",!b.textContent.includes(e.target.value)));</script></body></html>
