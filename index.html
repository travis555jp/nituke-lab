<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>煮付けラボ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#20231f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;line-height:1.55}main{max-width:720px;margin:auto;padding:24px 14px 100px}.card{background:#fff;border:1px solid #dddcd5;border-radius:18px;padding:16px;margin-top:12px}h1{font-size:34px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}.muted{color:#6c716b;font-size:13px}select,input{width:100%;font-size:16px;padding:13px;border:1px solid #dddcd5;border-radius:12px;background:#fff}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.chip{min-height:48px;border:1px solid #dddcd5;border-radius:12px;background:#fafaf7;text-align:left;padding:9px;font-weight:700}.chip.on{background:#285f50;color:#fff}.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:#f4f2ecef;border-top:1px solid #ddd}.bar div{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.clear{min-height:50px;border:0;border-radius:14px;font-size:16px;font-weight:800;padding:0 18px}.primary{background:#285f50;color:#fff}.clear{background:#e5e4df}.result{display:none}.result.show{display:block}.score{font-size:40px;font-weight:900;color:#285f50}.pair,.flavor,.step{border:1px solid #dddcd5;border-radius:12px;padding:11px;margin-top:8px}.badge{float:right;background:#e8f0ec;color:#285f50;border-radius:999px;padding:3px 8px;font-size:12px}.section{margin-top:18px}.section h3{font-size:14px}.hidden{display:none!important}</style></head><body><main><h1>煮付けラボ</h1><div class="muted">魚と素材から、相性・味方向・煮る順番を組み立てます。</div><section class="card"><h2>魚と仕上がり</h2><select id="fish"><option>サバ</option><option>ブリ</option><option>鯛</option><option>タラ</option><option>カレイ</option><option>金目鯛</option><option>鮭</option><option>サワラ</option><option>アジ</option><option>イワシ</option><option>サンマ</option><option>メカジキ</option><option>メバル</option><option>カサゴ</option><option>ヒラメ</option></select><br><br><select id="mood"><option>おまかせ</option><option>さっぱり</option><option>ご飯に合う</option><option>酒に合う</option><option>甘くない</option><option>こってり</option><option>洋風</option></select></section><section class="card"><h2>一緒に煮る素材</h2><input id="search" placeholder="素材を絞り込み"><div class="chips" id="chips"></div><p class="muted">複数選択できます。何も選ばず分析するとおすすめ素材を表示します。</p></section><section class="card result" id="result"><div id="out"></div></section></main><div class="bar"><div><button class="primary" id="go">相性を分析</button><button class="clear" id="clear">クリア</button></div></div><script>const F={"サバ":[5,5,5,3,8],"ブリ":[5,4,4,4,9],"鯛":[2,3,2,4,8],"タラ":[1,2,2,2,7],"カレイ":[2,3,2,5,8],"金目鯛":[4,4,3,5,9],"鮭":[4,4,3,2,8],"サワラ":[3,3,2,2,7],"アジ":[3,4,4,2,7],"イワシ":[4,5,5,3,6],"サンマ":[5,4,5,2,7],"メカジキ":[3,3,2,1,9],"メバル":[2,4,2,5,9],"カサゴ":[2,4,3,5,9],"ヒラメ":[1,3,1,4,7]};const V={"大根":[5,3,3,2,1,18,"吸う"],"かぶ":[4,2,4,2,1,10,"淡い"],"茄子":[5,5,2,2,1,9,"脂を吸う"],"白菜":[5,4,4,2,1,8,"甘味"],"玉ねぎ":[3,3,5,3,3,12,"甘味"],"長ねぎ":[3,3,4,2,4,8,"香味"],"じゃがいも":[3,3,3,2,1,16,"ボディ"],"里芋":[4,3,3,2,1,17,"とろみ"],"ごぼう":[3,3,2,3,5,16,"香り"],"れんこん":[3,2,3,2,2,14,"食感"],"冬瓜":[5,2,2,1,1,13,"吸う"],"豆腐":[5,3,1,2,1,5,"吸う"],"厚揚げ":[4,4,1,3,2,7,"コク"],"トマト":[2,2,3,5,4,7,"酸味・旨味"],"きのこ":[3,2,1,5,4,6,"旨味"],"キャベツ":[4,4,5,2,1,8,"甘味"],"にんじん":[2,2,5,2,2,15,"甘味"],"セロリ":[2,2,2,2,5,8,"香味"],"ピーマン":[3,4,2,2,4,5,"青い香り"],"ズッキーニ":[4,4,2,2,1,7,"吸う"],"ししとう":[2,3,1,1,4,4,"香味"],"たけのこ":[2,2,2,3,3,10,"食感"],"小松菜":[3,3,2,2,2,3,"青菜"],"春菊":[2,2,1,2,5,2,"香り"],"長芋":[3,2,2,2,1,8,"食感"],"こんにゃく":[3,1,0,0,1,12,"食感"],"オクラ":[2,2,1,2,1,3,"とろみ"],"干し椎茸":[4,2,2,5,5,12,"旨味"]};const flavors=[["塩・酒・柑橘","魚の出汁を前に出し、最後の酸味で締める。"],["黒酢・生姜・醤油","脂を酸味で切り、生姜で香りを整える。"],["味噌・生姜","旨味とコクを足し、根菜や豆腐にも味を渡す。"],["トマト・白だし","酸味と旨味を重ね、魚の脂を軽くまとめる。"],["薄口醤油・昆布・山椒","繊細な白身を壊さず、旨味と香りを補う。"],["白ワイン・玉ねぎ・ハーブ","魚から出た煮汁を洋風に育てる。"]];const sel=new Set,fish=document.getElementById('fish'),chips=document.getElementById('chips'),result=document.getElementById('result'),out=document.getElementById('out');Object.entries(V).forEach(([n,v])=>{let b=document.createElement('button');b.className='chip';b.innerHTML=n+'<div class="muted">'+v[6]+'</div>';b.onclick=()=>{sel.has(n)?sel.delete(n):sel.add(n);b.classList.toggle('on')};chips.appendChild(b)});function score(n){let f=F[fish.value],v=V[n],s=43;s+=16*f[0]/5*v[1]/5+15*f[1]/5*v[0]/5+8*(6-f[1])/5*v[3]/5+7*f[2]/5*v[2]/5+6*f[3]/5*v[0]/5;return Math.min(98,Math.round(s))}function why(n){let f=F[fish.value],v=V[n],a=[];if(f[0]>=4&&v[1]>=4)a.push(n+'が魚の脂と煮汁を受け止める');if(f[1]>=4&&v[0]>=4)a.push('魚の旨味を'+n+'に含ませやすい');if(f[1]<=2&&v[3]>=4)a.push(n+'から旨味を補える');if(f[2]>=4&&v[2]>=4)a.push(n+'の甘味が魚の強い香りを丸くする');if(f[3]>=4&&v[0]>=4)a.push('ゼラチン質を含む煮汁を抱え込める');return (a[0]||'煮汁を介して味を一体化しやすい')+'。'}function analyze(){let a=[...sel];if(!a.length)a=Object.keys(V).sort((x,y)=>score(y)-score(x)).slice(0,8);let total=Math.round(a.reduce((s,n)=>s+score(n),0)/a.length);let f=F[fish.value],long=a.filter(n=>V[n][5]>=f[4]+4),short=a.filter(n=>V[n][5]<=f[4]-2);let flav=flavors;if(f[0]>=4)flav=[flavors[1],flavors[3],flavors[2]];else if(f[1]<=2)flav=[flavors[4],flavors[0],flavors[2]];else flav=[flavors[4],flavors[0],flavors[3]];out.innerHTML='<div class="score">'+total+' / 100</div><b>'+fish.value+' × '+a.join(' × ')+'</b><div class="section"><h3>素材ごとの相性</h3>'+a.map(n=>'<div class="pair"><span class="badge">'+score(n)+'点</span><b>'+fish.value+' × '+n+'</b><div class="muted">'+why(n)+'</div></div>').join('')+'</div><div class="section"><h3>味付け候補</h3>'+flav.map((x,i)=>'<div class="flavor"><b>第'+(i+1)+'候補　'+x[0]+'</b><div class="muted">'+x[1]+'</div></div>').join('')+'</div><div class="section"><h3>煮る順番</h3>'+(long.length?'<div class="step"><b>1. 野菜を先に</b><div class="muted">'+long.join('・')+'を薄い煮汁で先行加熱。</div></div>':'')+'<div class="step"><b>魚を入れる</b><div class="muted">強く沸騰させ続けず約'+f[4]+'分。魚から旨味を煮汁へ出す。</div></div>'+(short.length?'<div class="step"><b>火の早い素材は後半</b><div class="muted">'+short.join('・')+'は香りや食感を残す。</div></div>':'')+'<div class="step"><b>魚を先に取り出す</b><div class="muted">魚の火入れを止め、残った素材と煮汁だけを仕上げる。</div></div><div class="step"><b>煮汁を完成</b><div class="muted">煮詰める・酸味を足す・味噌を溶くなどして、魚自身の出汁をソース化する。</div></div></div>';result.classList.add('show');result.scrollIntoView({behavior:'smooth'})}document.getElementById('go').onclick=analyze;document.getElementById('clear').onclick=()=>{sel.clear();document.querySelectorAll('.chip').forEach(b=>b.classList.remove('on'));result.classList.remove('show')};document.getElementById('search').oninput=e=>document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('hidden',!b.textContent.includes(e.target.value)));</script></body></html>
