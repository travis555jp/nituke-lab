</style></head><body><main><h1>煮付けラボ</h1><div class="muted">魚と素材から、相性・味方向・煮る順番・仕上げのひと工夫を組み立てます。相性スコア Ver.2（基準ペア校正）／味付け候補 Ver.2（王道含む）。</div><section class="card"><h2>魚と仕上がり</h2><select id="fish"><option>サバ</option><option>ブリ</option><option>鯛</option><option>タラ</option><option>カレイ</option><option>金目鯛</option><option>鮭</option><option>サワラ</option><option>アジ</option><option>イワシ</option><option>サンマ</option><option>メカジキ</option><option>メバル</option><option>カサゴ</option><option>ヒラメ</option></select><br><br><select id="mood"><option>おまかせ</option><option>さっぱり</option><option>ご飯に合う</option><option>酒に合う</option><option>甘くない</option><option>こってり</option><option>洋風</option></select></section><section class="card"><h2>一緒に煮る素材</h2><input id="search" placeholder="素材を絞り込み"><div class="chips" id="chips"></div><p class="muted">複数選択できます。何も選ばず分析するとおすすめ素材を表示します。</p></section><section class="card result" id="result"><div id="out"></div></section></main><div class="bar"><div><button class="primary" id="go">相性を分析</button><button class="clear" id="clear">クリア</button></div></div><script>

,west:5,green:2,rich:4,note:"脂のある魚とじゃがいも系を力強い香りでまとめる。"},{name:"パセリ",cut:2,fishy:1,fresh:4,hot:1,jp:1,west:5,green:4,rich:1,note:"洋風の煮汁を軽く仕上げ、色も整える。"}

const sel=new Set,fish=document.getElementById("fish"),mood=document.getElementById("mood"),chips=document.getElementById("chips"),result=document.getElementById("result"),out=document.getElementById("out");
Object.entries(V).forEach(([n,v])=>{let b=document.createElement("button");b.className="chip";b.innerHTML=n+'<div class="muted">'+v[6]+"</div>";b.onclick=()=>{sel.has(n)?sel.delete(n):sel.add(n);b.classList.toggle("on")};chips.appendChild(b)});
const BENCH={"ブリ|大根":97,"鯛|かぶ":95,"サバ|茄子":94,"カレイ|ごぼう":91,"タラ|白菜":91,"タラ|じゃがいも":90,"サバ|トマト":93,"鮭|キャベツ":92,"金目鯛|大根":96,"メバル|豆腐":92,"カサゴ|大根":93,"サワラ|かぶ":91,"アジ|茄子":91,"イワシ|トマト":92,"サンマ|大根":92,"メカジキ|トマト":90,"鯛|冬瓜":93,"鯛|白菜":90,"ブリ|ごぼう":92,"ブリ|里芋":91,"カレイ|豆腐":93,"鮭|じゃがいも":91,"タラ|きのこ":90,"サバ|大根":91,"ヒラメ|かぶ":92};
function rawScore(f,v){let s=43;s+=16*f[0]/5*v[1]/5+15*f[1]/5*v[0]/5+8*(6-f[1])/5*v[3]/5+7*f[2]/5*v[2]/5+6*f[3]/5*v[0]/5;return Math.min(98,s)}
function sim(a,b,sc){let d=0;for(let i=0;i<a.length;i++)d+=Math.pow((a[i]-b[i])/sc[i],2);return Math.exp(-d/2)}
function score(n){const fn=fish.value,key=fn+"|"+n;if(BENCH[key])return BENCH[key];const f=F[fn],v=V[n],raw=rawScore(f,v),near=[];Object.entries(BENCH).forEach(([k,target])=>{const [af,av]=k.split("|"),sf=sim(f,F[af],[4,4,4,4,10]),sv=sim(v.slice(0,6),V[av].slice(0,6),[5,5,5,5,5,18]),w=Math.pow(sf*sv,.7),res=target-rawScore(F[af],V[av]);near.push([w,res])});near.sort((a,b)=>b[0]-a[0]);const top=near.slice(0,5),ws=top.reduce((z,x)=>z+x[0],0)||1,corr=top.reduce((z,x)=>z+x[0]*x[1],0)/ws;return Math.max(45,Math.min(97,Math.round(raw+.75*corr)))}
function isBenchmark(n){return !!BENCH[fish.value+"|"+n]}
function why(n){let f=F[fish.value],v=V[n],a=[];if(f[0]>=4&&v[1]>=4)a.push(n+"が魚の脂と煮汁を受け止める");if(f[1]>=4&&v[0]>=4)a.push("魚の旨味を"+n+"に含ませやすい");if(f[1]<=2&&v[3]>=4)a.push(n+"から旨味を補える");if(f[2]>=4&&v[2]>=4)a.push(n+"の甘味が魚の強い香りを丸くする");if(f[3]>=4&&v[0]>=4)a.push("ゼラチン質を含む煮汁を抱え込める");return(a[0]||"煮汁を介して味を一体化しやすい")+"。"}
function flavorScore(x,f,a){const vs=a.map(n=>V[n]),avg=k=>vs.reduce((z,v)=>z+v[k],0)/Math.max(1,vs.length);let s=0;s+=f[0]*x.fishFat*1.2+f[2]*x.fishAroma*1.0;s+=(6-f[1])*x.umami*0.9;s+=avg(0)*x.absorb*0.9+avg(2)*x.vegetableSweet*0.45;if(x.name==="王道・甘辛醤油")s+=avg(0)*2.5+f[1]*1.6+f[3]*1.2;if(x.name==="甘さ控えめ・醤油酒生姜"&&avg(2)>=4)s+=6;if(x.name==="生姜強め・甘辛醤油"&&f[2]>=4)s+=10;const m=mood.value;if(m==="さっぱり")s+=x.light*5;else if(m==="ご飯に合う")s+=x.rice*5;else if(m==="酒に合う")s+=x.sake*5;else if(m==="甘くない")s+=x.nosweet*6-x.sweet*3;else if(m==="こってり")s+=x.rich*5;else if(m==="洋風")s+=x.west*7-x.jp*1.5;else{s+=x.jp*1.2+x.rice*.8}return s}
function pickFlavors(f,a){return flavors.map(x=>[x,flavorScore(x,f,a)]).sort((p,q)=>q[1]-p[1]).slice(0,3).map(x=>x[0])}
function tipScore(x,f,a,flav){let s=0,vs=a.map(n=>V[n]),avg=k=>vs.reduce((z,v)=>z+v[k],0)/Math.max(1,vs.length);s+=f[0]*x.cut*1.4+f[2]*x.fishy*1.3;if(avg(2)>=4)s+=x.fresh*2;if(avg(4)>=4)s+=x.green*1.6;if(["王道・甘辛醤油","甘さ控えめ・醤油酒生姜","生姜強め・甘辛醤油","塩・酒・柑橘","薄口醤油・昆布・山椒"].includes(flav.name))s+=x.jp*2+x.fresh;if(["トマト・白だし","白ワイン・玉ねぎ・ハーブ"].includes(flav.name))s+=x.west*2+x.fresh;if(mood.value==="洋風")s+=x.west*4;if(mood.value==="さっぱり"||mood.value==="甘くない")s+=x.cut*3+x.fresh*2;if(mood.value==="こってり")s+=x.rich*3+x.hot;if(mood.value==="酒に合う")s+=x.hot*2+x.fishy;if(mood.value==="ご飯に合う")s+=x.jp*2+x.hot;return s}
function analyze(){let a=[...sel];if(!a.length)a=Object.keys(V).sort((x,y)=>score(y)-score(x)).slice(0,8);let total=Math.round(a.reduce((s,n)=>s+score(n),0)/a.length),f=F[fish.value],long=a.filter(n=>V[n][5]>=f[4]+4),short=a.filter(n=>V[n][5]<=f[4]-2),flav=pickFlavors(f,a);let tips=A.map(x=>[x,tipScore(x,f,a,flav[0])]).sort((p,q)=>q[1]-p[1]).slice(0,3),best=tips[0][0];out.innerHTML='<div class="score">'+total+' / 100</div><b>'+fish.value+" × "+a.join(" × ")+'</b><div class="section"><h3>素材ごとの相性</h3>'+a.map(n=>'<div class="pair"><span class="badge">'+score(n)+"点</span><b>"+fish.value+" × "+n+'</b>'+(isBenchmark(n)?'<div class="muted">✓ 基準ペアで校正済み</div>':'')+'<div class="muted">'+why(n)+"</div></div>").join("")+'</div><div class="section"><h3>味付け候補</h3>'+flav.map((x,i)=>'<div class="flavor"><b>第'+(i+1)+"候補　"+x.name+'</b><div class="muted">'+x.desc+"</div></div>").join("")+'</div><div class="section"><h3>💡 ワンポイント</h3><div class="tip"><b>'+best.name+" を仕上げに</b><div>"+best.note+'</div><div class="muted">この組み合わせと「'+flav[0].name+'」方向に合わせた提案です。</div><div class="alts"><span>別案 '+tips[1][0].name+"</span><span>別案 "+tips[2][0].name+"</span></div></div></div><div class="section"><h3>煮る順番</h3>"+(long.length?'<div class="step"><b>1. 野菜を先に</b><div class="muted">'+long.join("・")+"を薄い煮汁で先行加熱。</div></div>":"")+'<div class="step"><b>魚を入れる</b><div class="muted">強く沸騰させ続けず約'+f[4]+"分。魚から旨味を煮汁へ出す。</div></div>"+(short.length?'<div class="step"><b>火の早い素材は後半</b><div class="muted">'+short.join("・")+"は香りや食感を残す。</div></div>":"")+'<div class="step"><b>魚を先に取り出す</b><div class="muted">魚の火入れを止め、残った素材と煮汁だけを仕上げる。</div></div><div class="step"><b>煮汁を完成</b><div class="muted">煮詰める・酸味を足す・味噌を溶くなどして、魚自身の出汁をソース化する。</div></div></div>';result.classList.add("show");result.scrollIntoView({behavior:"smooth"})}
document.getElementById("go").onclick=analyze;document.getElementById("clear").onclick=()=>{sel.clear();document.querySelectorAll(".chip").forEach(b=>b.classList.remove("on"));result.classList.remove("show")};document.getElementById("search").oninput=e=>document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("hidden",!b.textContent.includes(e.target.value)));
</script></body></html>
