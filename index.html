<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>煮付けラボ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#20231f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;line-height:1.5}main{max-width:720px;margin:auto;padding:22px 14px 100px}h1{margin:0 0 6px;font-size:34px}.muted{color:#68706a;font-size:13px}.card{background:#fff;border:1px solid #dddcd5;border-radius:18px;padding:15px;margin-top:12px}select,input[type=search]{width:100%;font-size:16px;padding:12px;border:1px solid #dddcd5;border-radius:12px;background:#fff}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.chip{border:1px solid #dddcd5;border-radius:12px;background:#fafaf7;overflow:hidden}.chip input{position:absolute;opacity:0}.chip span{display:block;min-height:52px;padding:8px 10px;font-weight:700}.chip small{display:block;font-weight:400;color:#68706a}.chip input:checked+span{background:#285f50;color:#fff}.chip input:checked+span small{color:#dce8e3}.bar{position:fixed;left:0;right:0;bottom:0;background:#f4f2ecef;border-top:1px solid #ddd;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px)}.bar div{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px}.bar button{min-height:50px;border:0;border-radius:14px;font-size:16px;font-weight:800;padding:0 18px}.go{background:#285f50;color:#fff}.clear{background:#e5e4df}.result{display:none}.result.show{display:block}.score{font-size:38px;font-weight:900;color:#285f50}.pair,.flavor,.tip,.step{border:1px solid #dddcd5;border-radius:12px;padding:10px;margin-top:8px}.badge{float:right;background:#e8f0ec;color:#285f50;border-radius:999px;padding:3px 8px;font-size:12px}.tip{background:#fff8e9}.sec{margin-top:17px}.sec h3{font-size:14px}.hidden{display:none!important}</style></head><body><main><h1>煮付けラボ</h1><div class="muted">相性スコア Ver.2／素材37種／ナンプラー・アジアン味対応／UI安定版</div><section class="card"><h2>魚と仕上がり</h2><select id="fish"><option>サバ</option><option>ブリ</option><option>鯛</option><option>タラ</option><option>カレイ</option><option>金目鯛</option><option>鮭</option><option>サワラ</option><option>アジ</option><option>イワシ</option><option>サンマ</option><option>メカジキ</option><option>メバル</option><option>カサゴ</option><option>ヒラメ</option></select><br><br><select id="mood"><option>おまかせ</option><option>さっぱり</option><option>ご飯に合う</option><option>酒に合う</option><option>甘くない</option><option>こってり</option><option>洋風</option><option>アジアン</option></select></section><section class="card"><h2>一緒に煮る素材</h2><input id="search" type="search" placeholder="素材を絞り込み"><div class="chips" id="chips"><label class="chip"><input type="checkbox" name="veg" value="大根"><span>大根<small>吸う</small></span></label><label class="chip"><input type="checkbox" name="veg" value="かぶ"><span>かぶ<small>淡い</small></span></label><label class="chip"><input type="checkbox" name="veg" value="茄子"><span>茄子<small>脂を吸う</small></span></label><label class="chip"><input type="checkbox" name="veg" value="白菜"><span>白菜<small>甘味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="玉ねぎ"><span>玉ねぎ<small>甘味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="長ねぎ"><span>長ねぎ<small>香味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="じゃがいも"><span>じゃがいも<small>ボディ</small></span></label><label class="chip"><input type="checkbox" name="veg" value="里芋"><span>里芋<small>とろみ</small></span></label><label class="chip"><input type="checkbox" name="veg" value="ごぼう"><span>ごぼう<small>香り</small></span></label><label class="chip"><input type="checkbox" name="veg" value="れんこん"><span>れんこん<small>食感</small></span></label><label class="chip"><input type="checkbox" name="veg" value="冬瓜"><span>冬瓜<small>吸う</small></span></label><label class="chip"><input type="checkbox" name="veg" value="豆腐"><span>豆腐<small>吸う</small></span></label><label class="chip"><input type="checkbox" name="veg" value="厚揚げ"><span>厚揚げ<small>コク</small></span></label><label class="chip"><input type="checkbox" name="veg" value="トマト"><span>トマト<small>酸味・旨味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="しいたけ"><span>しいたけ<small>旨味・香り</small></span></label><label class="chip"><input type="checkbox" name="veg" value="まいたけ"><span>まいたけ<small>旨味・香り</small></span></label><label class="chip"><input type="checkbox" name="veg" value="えのき"><span>えのき<small>旨味・とろみ</small></span></label><label class="chip"><input type="checkbox" name="veg" value="しめじ"><span>しめじ<small>旨味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="エリンギ"><span>エリンギ<small>食感</small></span></label><label class="chip"><input type="checkbox" name="veg" value="キャベツ"><span>キャベツ<small>甘味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="にんじん"><span>にんじん<small>甘味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="セロリ"><span>セロリ<small>香味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="ピーマン"><span>ピーマン<small>青い香り</small></span></label><label class="chip"><input type="checkbox" name="veg" value="ズッキーニ"><span>ズッキーニ<small>吸う</small></span></label><label class="chip"><input type="checkbox" name="veg" value="ししとう"><span>ししとう<small>香味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="たけのこ"><span>たけのこ<small>食感</small></span></label><label class="chip"><input type="checkbox" name="veg" value="小松菜"><span>小松菜<small>青菜</small></span></label><label class="chip"><input type="checkbox" name="veg" value="春菊"><span>春菊<small>香り</small></span></label><label class="chip"><input type="checkbox" name="veg" value="長芋"><span>長芋<small>食感</small></span></label><label class="chip"><input type="checkbox" name="veg" value="こんにゃく"><span>こんにゃく<small>食感</small></span></label><label class="chip"><input type="checkbox" name="veg" value="オクラ"><span>オクラ<small>とろみ</small></span></label><label class="chip"><input type="checkbox" name="veg" value="干し椎茸"><span>干し椎茸<small>濃い旨味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="ゴーヤ"><span>ゴーヤ<small>苦味・青香</small></span></label><label class="chip"><input type="checkbox" name="veg" value="はんぺん"><span>はんぺん<small>吸う・魚旨味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="モロヘイヤ"><span>モロヘイヤ<small>とろみ・青菜</small></span></label><label class="chip"><input type="checkbox" name="veg" value="納豆"><span>納豆<small>発酵・旨味</small></span></label><label class="chip"><input type="checkbox" name="veg" value="キムチ"><span>キムチ<small>発酵・辛味</small></span></label></div><p class="muted">複数選択できます。何も選ばず分析するとおすすめ素材を表示します。</p></section><section class="card result" id="result"><div id="out"></div></section></main><div class="bar"><div><button type="button" class="go" id="go">相性を分析</button><button type="button" class="clear" id="clear">クリア</button></div></div><script>var F={"サバ":[5,5,5,3,8],"ブリ":[5,4,4,4,9],"鯛":[2,3,2,4,8],"タラ":[1,2,2,2,7],"カレイ":[2,3,2,5,8],"金目鯛":[4,4,3,5,9],"鮭":[4,4,3,2,8],"サワラ":[3,3,2,2,7],"アジ":[3,4,4,2,7],"イワシ":[4,5,5,3,6],"サンマ":[5,4,5,2,7],"メカジキ":[3,3,2,1,9],"メバル":[2,4,2,5,9],"カサゴ":[2,4,3,5,9],"ヒラメ":[1,3,1,4,7]};var V={"大根":[5,3,3,2,1,18],"かぶ":[4,2,4,2,1,10],"茄子":[5,5,2,2,1,9],"白菜":[5,4,4,2,1,8],"玉ねぎ":[3,3,5,3,3,12],"長ねぎ":[3,3,4,2,4,8],"じゃがいも":[3,3,3,2,1,16],"里芋":[4,3,3,2,1,17],"ごぼう":[3,3,2,3,5,16],"れんこん":[3,2,3,2,2,14],"冬瓜":[5,2,2,1,1,13],"豆腐":[5,3,1,2,1,5],"厚揚げ":[4,4,1,3,2,7],"トマト":[2,2,3,5,4,7],"しいたけ":[3,2,1,5,4,7],"まいたけ":[3,3,1,5,5,6],"えのき":[4,2,1,4,2,4],"しめじ":[3,2,1,4,3,6],"エリンギ":[2,2,1,3,2,8],"キャベツ":[4,4,5,2,1,8],"にんじん":[2,2,5,2,2,15],"セロリ":[2,2,2,2,5,8],"ピーマン":[3,4,2,2,4,5],"ズッキーニ":[4,4,2,2,1,7],"ししとう":[2,3,1,1,4,4],"たけのこ":[2,2,2,3,3,10],"小松菜":[3,3,2,2,2,3],"春菊":[2,2,1,2,5,2],"長芋":[3,2,2,2,1,8],"こんにゃく":[3,1,0,0,1,12],"オクラ":[2,2,1,2,1,3],"干し椎茸":[4,2,2,5,5,12],"ゴーヤ":[2,2,0,1,5,5],"はんぺん":[4,2,2,3,1,3],"モロヘイヤ":[3,2,1,2,2,2],"納豆":[1,1,1,5,5,2],"キムチ":[2,2,2,4,5,4]};var B={"ブリ|大根":97,"鯛|かぶ":95,"サバ|茄子":94,"カレイ|ごぼう":91,"タラ|白菜":91,"タラ|じゃがいも":90,"サバ|トマト":93,"鮭|キャベツ":92,"金目鯛|大根":96,"メバル|豆腐":92,"カサゴ|大根":93,"サワラ|かぶ":91,"アジ|茄子":91,"イワシ|トマト":92,"サンマ|大根":92,"メカジキ|トマト":90,"鯛|冬瓜":93,"鯛|白菜":90,"ブリ|ごぼう":92,"ブリ|里芋":91,"カレイ|豆腐":93,"鮭|じゃがいも":91,"タラ|しめじ":90,"サバ|大根":91,"ヒラメ|かぶ":92};var FL=[['王道・甘辛醤油','醤油・酒・みりん・砂糖。魚の旨味を受けた煮汁を素材に含ませる基準の味。','jp'],['甘さ控えめ・醤油酒生姜','醤油・酒・生姜を軸に甘味を控える。','jp'],['生姜強め・甘辛醤油','王道甘辛に生姜を強めに効かせる。','jp'],['塩・酒・柑橘','魚の出汁を前に出し、最後の酸味で締める。','light'],['黒酢・生姜・醤油','脂を黒酢で切り、生姜で香りを整える。','light'],['味噌・生姜','旨味とコクを足し、根菜や豆腐にも味を渡す。','rich'],['トマト・白だし','酸味と旨味を重ね、魚の脂を軽くまとめる。','west'],['薄口醤油・昆布・山椒','繊細な白身を壊さず旨味と香りを補う。','light'],['白ワイン・玉ねぎ・ハーブ','魚の煮汁を白ワインと香味野菜で洋風に育てる。','west'],['ナンプラー・ライム・生姜','魚醤の発酵旨味を重ね、ライムと生姜で軽く締める。','asian'],['ナンプラー・黒糖・唐辛子','ナンプラーに少量の黒糖と唐辛子。甘辛を東南アジア方向へ。','asian'],['ナンプラー・トマト・レモングラス','トマトの酸味と魚醤の旨味、レモングラスの香り。','asian'],['ナンプラー・ココナッツミルク','魚醤の塩味と魚の旨味をココナッツミルクで包む。','asian']];var TIP={jp:[['生姜','魚の香りを整え、煮汁に芯を作る。'],['粉山椒','脂の後味を軽くし、甘辛い煮汁に輪郭を出す。'],['柚子皮','香りを持ち上げ、重さを残さず余韻を作る。']],light:[['柚子皮','香りを持ち上げ、後味を軽くする。'],['みょうが','甘辛さや脂を軽く感じさせる。'],['柚子胡椒','脂とコクを切りつつ柑橘香と辛味を足す。']],west:[['ディル','白身や鮭に清涼感を足す。'],['黒胡椒','辛味と香ばしい輪郭を足す。'],['タイム','トマトや玉ねぎの煮汁に奥行きを足す。']],rich:[['生姜','コクのある煮汁を締める。'],['唐辛子','甘さや脂に辛味の軸を作る。'],['粉山椒','重い後味を軽くする。']],asian:[['レモングラス','魚の香りを整え、爽やかな柑橘系の香りを煮汁に移す。'],['ライム','仕上げの酸味で魚の脂と魚醤の発酵香を締める。'],['パクチー','ナンプラー系に青く鮮烈な香りを足す。']]};var fish=document.getElementById('fish'),mood=document.getElementById('mood'),result=document.getElementById('result'),out=document.getElementById('out');function raw(f,v){return Math.min(98,43+16*f[0]/5*v[1]/5+15*f[1]/5*v[0]/5+8*(6-f[1])/5*v[3]/5+7*f[2]/5*v[2]/5+6*f[3]/5*v[0]/5)}function score(n){var k=fish.value+'|'+n;if(B[k])return B[k];return Math.max(50,Math.min(96,Math.round(raw(F[fish.value],V[n])+18)))}function why(n){var f=F[fish.value],v=V[n];if(f[1]>=4&&v[0]>=4)return'魚の旨味を'+n+'に含ませやすい。';if(f[0]>=4&&v[1]>=4)return n+'が魚の脂と煮汁を受け止める。';if(v[3]>=4)return n+'の旨味が煮汁に重なり、魚を補強する。';if(v[4]>=4)return n+'の香りが魚の個性と煮汁に輪郭を作る。';return'煮汁を介して味を一体化しやすい。'}function flavors(a){var m=mood.value,arr=FL.slice();function pri(x){var s=0;if(m==='アジアン'&&x[2]==='asian')s+=100;if(m==='洋風'&&x[2]==='west')s+=100;if(m==='さっぱり'&&(x[2]==='light'||x[2]==='asian'))s+=60;if(m==='こってり'&&x[2]==='rich')s+=80;if(m==='ご飯に合う'&&x[2]==='jp')s+=60;if(m==='酒に合う'&&(x[2]==='light'||x[2]==='asian'))s+=45;if(m==='甘くない'&&(x[0].indexOf('甘辛')<0&&x[0].indexOf('黒糖')<0))s+=50;if(m==='おまかせ'&&x[2]==='jp')s+=20;if(a.indexOf('トマト')>=0&&(x[2]==='west'||x[2]==='asian'))s+=20;if(a.indexOf('キムチ')>=0&&x[2]==='asian')s+=30;if(a.indexOf('ゴーヤ')>=0&&x[2]==='asian')s+=20;if(F[fish.value][0]>=4&&x[0].indexOf('生姜')>=0)s+=15;return s}return arr.sort(function(x,y){return pri(y)-pri(x)}).slice(0,3)}function analyze(){try{var checked=document.querySelectorAll('input[name="veg"]:checked'),a=[],i;for(i=0;i<checked.length;i++)a.push(checked[i].value);if(!a.length){a=Object.keys(V).sort(function(x,y){return score(y)-score(x)}).slice(0,8)}var f=F[fish.value],fl=flavors(a),tp=TIP[fl[0][2]]||TIP.jp,total=Math.round(a.reduce(function(s,n){return s+score(n)},0)/a.length),long=a.filter(function(n){return V[n][5]>=f[4]+4}),short=a.filter(function(n){return V[n][5]<=f[4]-2});out.innerHTML='<div class="score">'+total+' / 100</div><b>'+fish.value+' × '+a.join(' × ')+'</b><div class="sec"><h3>素材ごとの相性</h3>'+a.map(function(n){return'<div class="pair"><span class="badge">'+score(n)+'点</span><b>'+fish.value+' × '+n+'</b><div class="muted">'+why(n)+'</div></div>'}).join('')+'</div><div class="sec"><h3>味付け候補</h3>'+fl.map(function(x,j){return'<div class="flavor"><b>第'+(j+1)+'候補　'+x[0]+'</b><div class="muted">'+x[1]+'</div></div>'}).join('')+'</div><div class="sec"><h3>💡 ワンポイント</h3><div class="tip"><b>'+tp[0][0]+'を仕上げに</b><div>'+tp[0][1]+'</div><div class="muted">別案：'+tp[1][0]+'／'+tp[2][0]+'</div></div></div><div class="sec"><h3>煮る順番</h3>'+(long.length?'<div class="step"><b>先に煮る</b><div class="muted">'+long.join('・')+'を先行加熱。</div></div>':'')+'<div class="step"><b>魚を入れる</b><div class="muted">約'+f[4]+'分を目安に、強く沸騰させ続けず煮る。</div></div>'+(short.length?'<div class="step"><b>後半に加える</b><div class="muted">'+short.join('・')+'は香りや食感を残す。</div></div>':'')+'<div class="step"><b>魚を先に取り出す</b><div class="muted">魚の火入れを止め、素材と煮汁だけを仕上げる。</div></div></div>';result.classList.add('show');result.scrollIntoView(true)}catch(e){result.classList.add('show');out.innerHTML='<div class="tip"><b>分析エラー</b><div>'+e.message+'</div></div>'}}document.getElementById('go').onclick=analyze;document.getElementById('clear').onclick=function(){var b=document.querySelectorAll('input[name="veg"]');for(var i=0;i<b.length;i++)b[i].checked=false;result.classList.remove('show')};document.getElementById('search').oninput=function(e){var q=e.target.value,c=document.querySelectorAll('.chip');for(var i=0;i<c.length;i++)c[i].classList.toggle('hidden',c[i].textContent.indexOf(q)<0)};</script></body></html>
