<section class="card result" id="result"><div id="out"></div></section>

{n:"ナンプラー・ココナッツミルク",d:"魚醤の塩味と魚の旨味をココナッツミルクで包む。",t:"asian",rec:[["ココナッツミルク",50],["水",30],["ナンプラー",8],["砂糖",2]]}
];

var fish=document.getElementById('fish'),mood=document.getElementById('mood'),weight=document.getElementById('weight'),result=document.getElementById('result'),out=document.getElementById('out');

function fill(id,d,n){var h='',k,v;for(k in d){v=d[k];h+='<label class="chip"><input type="checkbox" name="'+n+'" value="'+k+'"><span>'+k+'<small>'+v[v.length-1]+'</small></span></label>'}document.getElementById(id).innerHTML=h}
fill('r',R,'receive');fill('b',B,'build');fill('g',G,'finish');
function vals(n){var a=[],x=document.querySelectorAll('input[name="'+n+'"]:checked'),i;for(i=0;i<x.length;i++)a.push(x[i].value);return a}

/* ===== 既存スコア（Ver.4のまま） ===== */
function rs(n){var f=F[fish.value],v=R[n],k=fish.value+'|'+n;if(A[k])return A[k];return Math.max(50,Math.min(96,Math.round(59+16*f[0]/5*v[1]/5+15*f[1]/5*v[0]/5+8*(6-f[1])/5*v[3]/5+7*f[2]/5*v[2]/5+6*f[3]/5*v[0]/5)))}
function bs(n){var f=F[fish.value],x=B[n],m=mood.value,s=46+(6-f[1])*x[0]*1.1+f[2]*x[3]*.8+f[0]*(x[2]+x[6])*.8+x[1]*.6+x[5]*1.3;if(m==='アジアン')s+=x[8]*4;if(m==='洋風')s+=x[9]*4;if(m==='ご飯に合う'||m==='おまかせ')s+=x[7]*2;if(m==='さっぱり'||m==='甘くない')s+=x[2]*2+x[6]*2;return Math.max(50,Math.min(98,Math.round(s)))}
function gs(n){var f=F[fish.value],x=G[n],m=mood.value,s=48+f[0]*(x[0]+x[4])*.7+f[2]*x[2]*.7+x[1]*1.5+x[3]*.8+x[5]*.5;if(m==='アジアン')s+=x[7]*4;if(m==='洋風')s+=x[8]*4;if(m==='ご飯に合う'||m==='おまかせ')s+=x[6]*2;if(m==='さっぱり')s+=x[0]*2+x[1]*2+x[4]*2;return Math.max(50,Math.min(98,Math.round(s)))}
function fl(rs1,bs1,gs1){var a=FL.slice(),m=mood.value;function p(x){var s=0;if(m==='アジアン'&&x.t==='asian')s+=100;if(m==='洋風'&&x.t==='west')s+=100;if(m==='さっぱり'&&(x.t==='light'||x.t==='asian'))s+=60;if(m==='こってり'&&x.t==='rich')s+=80;if(m==='ご飯に合う'&&x.t==='jp')s+=60;if(m==='酒に合う'&&(x.t==='light'||x.t==='asian'))s+=45;if(m==='甘くない'&&x.n.indexOf('甘辛')<0&&x.n.indexOf('黒糖')<0)s+=50;if(m==='おまかせ'&&x.t==='jp')s+=20;if(bs1.indexOf('トマト')>=0&&(x.t==='west'||x.t==='asian'))s+=30;if(bs1.indexOf('ナンプラー')>=0&&x.t==='asian')s+=50;if(bs1.indexOf('キムチ')>=0&&x.t==='asian')s+=35;if(bs1.indexOf('味噌')>=0&&x.t==='rich')s+=35;if(bs1.indexOf('昆布')>=0&&x.t==='light')s+=25;if(gs1.indexOf('ライム')>=0&&x.t==='asian')s+=30;if(gs1.indexOf('柚子皮')>=0&&x.t==='light')s+=20;return s}return a.sort(function(x,y){return p(y)-p(x)}).slice(0,3)}

/* ===== Ver.5 追加①：魚カルテ ===== */
function renderKarte(){
var f=F[fish.value],h='';
var pre = f[2]>=4?'霜降り必須（80℃の湯にくぐらせて冷水、血合いを洗う）':(f[2]===3?'霜降り推奨（湯通し→冷水）':'塩を振って10分おき、水気を拭くだけでOK');
var frag = f[3]<=2?'身が崩れやすい：途中で返さない・落とし蓋・取り出しはフライ返しで':'身はしっかりめ：多少煮汁を対流させても崩れにくい';
var tg=target();
h+='<div class="kg"><div><b>'+f[0]+'</b><small>脂</small></div><div><b>'+f[1]+'</b><small>旨味</small></div><div><b>'+f[2]+'</b><small>臭み</small></div><div><b>'+f[3]+'</b><small>身質</small></div></div>';
h+='<div>下処理：'+pre+'</div><div>'+frag+'</div>';
h+='<div>加熱目安：約'+f[4]+'分／推奨煮汁塩分：'+tg[0].toFixed(1)+'〜'+tg[1].toFixed(1)+'%'+(f[0]>=4?'（脂が強いのでやや濃いめ・酸との相性◎）':'')+'</div>';
document.getElementById('karte').innerHTML=h;
}
function target(){
var f=F[fish.value], r=vals('receive');
var lo=1.8, hi=2.2, note='煮詰めて絡める前提の濃度';
if(r.length>=1){lo=1.2;hi=1.6;note='受け素材に含ませる前提。煮汁多め・薄めで長めに含ませる'}
if(f[0]>=4){lo+=0.2;hi+=0.2}
return [lo,hi,note];
}

/* ===== Ver.5 追加②：煮汁の定量計算 ===== */
var chosenFlavor=0, lastCandidates=[];
function calcRecipe(fx){
var w=Math.max(50,parseFloat(weight.value)||200), r=vals('receive');
var scale=w/100;
var rows=[], salt=0, sugar=0, liquid=0, extraWater=r.length?40*scale:0;
fx.rec.forEach(function(it){
  var name=it[0], amt=it[1]*scale, s=S[name]||[0,0,'g',0];
  if(name==='水')amt+=extraWater;
  salt+=amt*s[0]; sugar+=amt*s[1]; if(s[3])liquid+=amt;
  rows.push([name, amt, s[2]]);
});
if(extraWater && !fx.rec.some(function(it){return it[0]==='水'})){rows.unshift(['水',extraWater,'ml']);liquid+=extraWater}
var sp=liquid>0?salt/(liquid+ (sugar*0.5))*100:0; /* 溶質の一部を分母に加味した近似 */
var gp=liquid>0?sugar/(liquid+(sugar*0.5))*100:0;
return {rows:rows, salt:sp, sugar:gp, w:w};
}
function fmtAmt(v,u){if(u==='ml'){return (v>=20?Math.round(v/5)*5:Math.round(v))+' ml'}return (v>=5?Math.round(v):Math.round(v*2)/2)+' g'}
function recipeHTML(fx){
var c=calcRecipe(fx), tg=target(), judge, tip='';
if(c.salt<tg[0]-0.05){judge='薄め';tip='醤油や塩を1〜2割足すか、最後に煮汁だけをしっかり詰める'}
else if(c.salt>tg[1]+0.05){judge='濃いめ';tip='水か酒を1〜2割足す'}
else{judge='適正';tip=tg[2]}
var h='<div class="lab">配合（魚 '+c.w+'g'+(vals('receive').length?'＋受け素材':'')+'）</div><table class="rec">';
c.rows.forEach(function(rw){h+='<tr><td>'+rw[0]+'</td><td>'+fmtAmt(rw[1],rw[2])+'</td></tr>'});
h+='</table><div class="gauge">煮汁塩分 <b>'+c.salt.toFixed(1)+'%</b> ／ 糖分 <b>'+c.sugar.toFixed(1)+'%</b>　→ <b>'+judge+'</b><div class="muted">目標 '+tg[0].toFixed(1)+'〜'+tg[1].toFixed(1)+'%。'+tip+'</div></div>';
return h;
}

/* ===== Ver.5 追加③：競合判定（減点） ===== */
function conflicts(r,b,g){
var f=F[fish.value], m=mood.value, out=[];
var all=b.concat(g);
function cnt(list,set){return list.filter(function(n){return set.indexOf(n)>=0}).length}
var acid=['すだち','レモン','ライム','梅干し','ヨーグルト','もずく','トマト'];
var ferm=['キムチ','豆豉','豆板醤','コチュジャン','ナンプラー','納豆','高菜漬け','ザーサイ','酒粕'];
var strong=['キムチ','豆板醤','豆豉','コチュジャン','にんにく'];
var herbs=['大葉','みょうが','三つ葉','パクチー','ミント','タイバジル','ディル','タイム','パセリ'];
var waCitrus=['柚子皮','すだち'], westHerb=['ディル','タイム','パセリ'];
var sweet=['白味噌','甘酒','ココナッツミルク','コチュジャン'];
var na=cnt(all,acid); if(na>=3)out.push(['酸味が渋滞（'+na+'種）。主役の酸を1つに絞ると輪郭が出る',5]);
var nf=cnt(b,ferm); if(nf>=3)out.push(['発酵素材が'+nf+'種。旨味は重なるが香りが濁りやすい。2種までが目安',6]);
if(f[0]<=2&&f[2]<=2&&cnt(b,strong)>0)out.push([fish.value+'は淡白なので、'+b.filter(function(n){return strong.indexOf(n)>=0}).join('・')+'に風味が負けやすい。量を通常の半分に',5]);
var nh=cnt(g,herbs); if(nh>=3)out.push(['仕上げの香草が'+nh+'種。香りの主役を1〜2つに',4]);
if(cnt(g,waCitrus)>0&&cnt(g,westHerb)>0)out.push(['和柑橘×洋ハーブは方向性が割れやすい。どちらかに寄せる',3]);
if(m==='甘くない'&&cnt(b,sweet)>0)out.push(['「甘くない」指定に対し甘味の強い素材（'+b.filter(function(n){return sweet.indexOf(n)>=0}).join('・')+'）が入っている',3]);
if(b.indexOf('ヨーグルト')>=0&&(b.indexOf('梅干し')>=0||b.indexOf('トマト')>=0))out.push(['ヨーグルトは強い酸と合わせると分離しやすい。火を止めてから加える',3]);
if(f[3]<=2){var longR=r.filter(function(n){return R[n][5]>=14});if(longR.length)out.push([longR.join('・')+'は加熱が長く、'+fish.value+'は崩れやすい。先に下茹でし、魚は後入れに（減点なし）',0])}
return out;
}

/* ===== Ver.5 追加④：記録（localStorage）＋一因子実験判定 ===== */
function store(){try{return JSON.parse(localStorage.getItem('nitukelab_records')||'[]')}catch(e){return []}}
function saveStore(a){try{localStorage.setItem('nitukelab_records',JSON.stringify(a));return true}catch(e){return false}}
function diffOf(a,b){
if(!b)return null;
var ch=[];
if(a.fish!==b.fish)ch.push('魚:'+b.fish+'→'+a.fish);
if(a.mood!==b.mood)ch.push('方向性:'+b.mood+'→'+a.mood);
if(a.fl!==b.fl)ch.push('味付け:'+b.fl+'→'+a.fl);
['r','b','g'].forEach(function(k){
  var add=a[k].filter(function(x){return b[k].indexOf(x)<0}),del=b[k].filter(function(x){return a[k].indexOf(x)<0});
  add.forEach(function(x){ch.push('＋'+x)});del.forEach(function(x){ch.push('−'+x)});
});
return ch;
}
function renderRecords(){
var a=store(),h='';
if(!a.length){h='<div class="muted" style="margin-top:8px">まだ記録がありません。分析結果の「この構成を保存」から追加できます。</div>'}
a.slice().reverse().forEach(function(rec,ri){
  var idx=a.length-1-ri, prev=idx>0?a[idx-1]:null, d=diffOf(rec,prev);
  var badge=d===null?'<span class="diffbadge">初回</span>':(d.length===0?'<span class="diffbadge">同一構成</span>':(d.length===1?'<span class="diffbadge">一因子実験 ✓</span>':'<span class="diffbadge">'+d.length+'因子変更</span>'));
  h+='<div class="recrow"><b>'+rec.fish+'（'+rec.mood+'）'+rec.score+'点</b>'+badge+
  '<div class="muted">'+new Date(rec.t).toLocaleString('ja-JP')+'／'+rec.fl+'</div>'+
  (rec.r.length||rec.b.length||rec.g.length?'<div class="muted">'+[].concat(rec.r,rec.b,rec.g).join('・')+'</div>':'')+
  (d&&d.length?'<div class="muted">変更点：'+d.join('、')+'</div>':'')+
  (rec.stars?'<div class="stars">'+'★'.repeat(rec.stars)+'☆'.repeat(5-rec.stars)+'</div>':'')+
  (rec.memo?'<div>'+rec.memo+'</div>':'')+
  '<div style="margin-top:6px"><button type="button" class="smallbtn" onclick="loadRec('+idx+')">読み込む</button> <button type="button" class="smallbtn" onclick="delRec('+idx+')">削除</button></div></div>';
});
document.getElementById('reclist').innerHTML=h;
}
function loadRec(i){
var a=store(),rec=a[i];if(!rec)return;
fish.value=rec.fish;mood.value=rec.mood;weight.value=rec.w||200;
document.querySelectorAll('input[type="checkbox"]').forEach(function(x){x.checked=(rec[{receive:'r',build:'b',finish:'g'}[x.name]]||[]).indexOf(x.value)>=0});
renderKarte();analyze();window.scrollTo({top:0});
}
function delRec(i){var a=store();a.splice(i,1);saveStore(a);renderRecords()}
function saveCurrent(){
var memo=document.getElementById('memo')?document.getElementById('memo').value:'';
var stars=document.getElementById('stars')?parseInt(document.getElementById('stars').value)||0:0;
var rec={t:Date.now(),fish:fish.value,mood:mood.value,w:parseFloat(weight.value)||200,r:vals('receive'),b:vals('build'),g:vals('finish'),fl:lastCandidates[chosenFlavor]?lastCandidates[chosenFlavor].n:'',score:lastScore,memo:memo,stars:stars};
var a=store();a.push(rec);
if(saveStore(a)){renderRecords();document.getElementById('savemsg').textContent='保存しました'}
else{document.getElementById('savemsg').textContent='この環境ではブラウザ保存が使えません'}
}

/* ===== Ver.5 追加⑤：URL共有 ===== */
function shareURL(){
var st={f:fish.value,m:mood.value,w:weight.value,r:vals('receive'),b:vals('build'),g:vals('finish')};
var url=location.origin+location.pathname+'#'+encodeURIComponent(JSON.stringify(st));
function done(){document.getElementById('sharemsg').textContent='リンクをコピーしました'}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done,function(){prompt('このURLをコピー',url)})}
else{prompt('このURLをコピー',url)}
}
function restoreHash(){
if(!location.hash||location.hash.length<3)return false;
try{
var st=JSON.parse(decodeURIComponent(location.hash.slice(1)));
if(st.f&&F[st.f])fish.value=st.f;
if(st.m)mood.value=st.m;
if(st.w)weight.value=st.w;
document.querySelectorAll('input[type="checkbox"]').forEach(function(x){x.checked=(st[{receive:'r',build:'b',finish:'g'}[x.name]]||[]).indexOf(x.value)>=0});
return true;
}catch(e){return false}
}

/* ===== 分析（Ver.4ベース＋Ver.5拡張） ===== */
var lastScore=0;
function flavorSection(){
var h='<div class="sec"><h3>味付け候補（タップで配合を切替）</h3>';
lastCandidates.forEach(function(x,j){h+='<div class="flavor'+(j===chosenFlavor?' on':'')+'" onclick="pickFlavor('+j+')"><b>第'+(j+1)+'候補　'+x.n+'</b><div class="muted">'+x.d+'</div></div>'});
h+='</div><div class="sec" id="recipebox">'+recipeHTML(lastCandidates[chosenFlavor])+'</div>';
return h;
}
function pickFlavor(j){chosenFlavor=j;
document.querySelectorAll('.flavor').forEach(function(el,i){el.classList.toggle('on',i===j)});
document.getElementById('recipebox').innerHTML=recipeHTML(lastCandidates[j]);
}
function analyze(){try{
var r=vals('receive'),b=vals('build'),g=vals('finish');
if(!r.length&&!b.length&&!g.length){r=Object.keys(R).sort(function(x,y){return rs(y)-rs(x)}).slice(0,6)}
var ra=r.length?Math.round(r.reduce(function(s,n){return s+rs(n)},0)/r.length):0,
    ba=b.length?Math.round(b.reduce(function(s,n){return s+bs(n)},0)/b.length):0,
    ga=g.length?Math.round(g.reduce(function(s,n){return s+gs(n)},0)/g.length):0,
    base=Math.max(50,Math.min(99,(ra||82)+Math.round((ba?ba-80:0)*.28)+Math.round((ga?ga-80:0)*.18)));
var cf=conflicts(r,b,g), pen=cf.reduce(function(s,c){return s+c[1]},0);
var total=Math.max(40,base-pen);
lastScore=total;
lastCandidates=fl(r,b,g);chosenFlavor=0;
var cook=F[fish.value][4],
    early=r.filter(function(n){return R[n][5]>=cook+4}),
    late=r.filter(function(n){return R[n][5]<=cook-2});
var h='<div class="score">'+total+' / 100'+(pen?'<small style="font-size:14px;color:#8a5a22">（構成 '+base+' − 注意 '+pen+'）</small>':'')+'</div>'+
'<b>'+fish.value+(r.length?' × '+r.join(' × '):'')+(b.length?' ＋ '+b.join(' ＋ '):'')+(g.length?' ／ '+g.join('・'):'')+'</b>'+
'<div class="scores"><div class="mini"><b>'+(ra||'—')+'</b><small>受ける</small></div><div class="mini"><b>'+(ba||'—')+'</b><small>作る</small></div><div class="mini"><b>'+(ga||'—')+'</b><small>仕上げ</small></div></div>';
if(cf.length){h+='<div class="sec"><h3>注意（競合判定）</h3>'+cf.map(function(c){return'<div class="warn">'+(c[1]?'<span class="badge">−'+c[1]+'点</span>':'<span class="badge">手順注意</span>')+c[0]+'</div>'}).join('')+'</div>'}
h+='<div class="sec"><h3>① 煮汁を受ける</h3>'+(r.length?r.map(function(n){return'<div class="item"><span class="badge">'+rs(n)+'点</span><b>'+fish.value+' × '+n+'</b><div class="muted">'+R[n][6]+'。魚の煮汁をどう受けるかで評価。</div></div>'}).join(''):'<div class="muted">選択なし</div>')+'</div>'+
'<div class="sec"><h3>② 煮汁を作る</h3>'+(b.length?b.map(function(n){return'<div class="item"><span class="badge">'+bs(n)+'点</span><b>'+n+'</b><div class="muted">'+B[n][11]+'。入れる目安：'+B[n][10]+'</div></div>'}).join(''):'<div class="muted">選択なし</div>')+'</div>'+
'<div class="sec"><h3>③ 仕上げる</h3>'+(g.length?g.map(function(n){return'<div class="item"><span class="badge">'+gs(n)+'点</span><b>'+n+'</b><div class="muted">'+G[n][10]+'。使う目安：'+G[n][9]+'</div></div>'}).join(''):'<div class="muted">選択なし</div>')+'</div>'+
flavorSection()+
'<div class="sec"><h3>煮る順番</h3>'+
(early.length?'<div class="step"><b>先に火を入れる</b><div class="muted">'+early.join('・')+'</div></div>':'')+
(b.length?'<div class="step"><b>煮汁を作る</b><div class="muted">'+b.map(function(n){return n+'（'+B[n][10]+'）'}).join('／')+'</div></div>':'')+
'<div class="step"><b>魚を入れる</b><div class="muted">約'+cook+'分を目安に、強く沸騰させ続けず煮る。</div></div>'+
(late.length?'<div class="step"><b>後半に加える</b><div class="muted">'+late.join('・')+'</div></div>':'')+
(g.length?'<div class="step"><b>仕上げ</b><div class="muted">'+g.map(function(n){return n+'（'+G[n][9]+'）'}).join('／')+'</div></div>':'')+
'<div class="step"><b>煮汁を完成</b><div class="muted">魚を先に取り出し、必要なら残った煮汁だけを詰めてソース化する。</div></div></div>'+
'<div class="sec"><h3>記録・共有</h3><input type="text" id="memo" placeholder="実食メモ（例：黒酢が効きすぎ、次は半量）"><div class="row2"><select id="stars"><option value="0">実食評価（未）</option><option value="1">★1</option><option value="2">★2</option><option value="3">★3</option><option value="4">★4</option><option value="5">★5</option></select><button type="button" class="smallbtn primary" onclick="saveCurrent()">この構成を保存</button></div><div style="margin-top:8px"><button type="button" class="smallbtn" onclick="shareURL()">共有リンクをコピー</button> <span class="muted" id="sharemsg"></span><span class="muted" id="savemsg"></span></div></div>';
out.innerHTML=h;
result.classList.add('show');result.scrollIntoView(true);
}catch(e){result.classList.add('show');out.innerHTML='<b>分析エラー</b><div>'+e.message+'</div>'}}

document.getElementById('go').onclick=analyze;
document.getElementById('clear').onclick=function(){var x=document.querySelectorAll('input[type="checkbox"]'),i;for(i=0;i<x.length;i++)x[i].checked=false;result.classList.remove('show');history.replaceState(null,'',location.pathname)};
document.getElementById('search').oninput=function(e){var q=e.target.value,c=document.querySelectorAll('.chip'),i;for(i=0;i<c.length;i++)c[i].classList.toggle('hidden',c[i].textContent.indexOf(q)<0)};
fish.onchange=renderKarte;
document.querySelector('main').addEventListener('change',function(e){if(e.target.name==='receive')renderKarte()});
renderKarte();renderRecords();
if(restoreHash()){renderKarte();analyze()}
</script></body></html>
