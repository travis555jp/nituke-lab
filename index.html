<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>煮付けラボ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#20231f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;line-height:1.5}main{max-width:720px;margin:auto;padding:22px 14px 100px}h1{margin:0 0 6px;font-size:34px}.muted{color:#68706a;font-size:13px}.card{background:#fff;border:1px solid #dddcd5;border-radius:18px;padding:15px;margin-top:12px}select,input[type=search]{width:100%;font-size:16px;padding:12px;border:1px solid #dddcd5;border-radius:12px;background:#fff}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.chip{border:1px solid #dddcd5;border-radius:12px;background:#fafaf7;overflow:hidden}.chip input{position:absolute;opacity:0}.chip span{display:block;min-height:52px;padding:8px 10px;font-weight:700}.chip small{display:block;font-weight:400;color:#68706a}.chip input:checked+span{background:#285f50;color:#fff}.chip input:checked+span small{color:#dce8e3}.bar{position:fixed;left:0;right:0;bottom:0;background:#f4f2ecef;border-top:1px solid #ddd;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px)}.bar div{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px}.bar button{min-height:50px;border:0;border-radius:14px;font-size:16px;font-weight:800;padding:0 18px}.go{background:#285f50;color:#fff}.clear{background:#e5e4df}.result{display:none}.result.show{display:block}.score{font-size:38px;font-weight:900;color:#285f50}.pair,.flavor,.tip,.step{border:1px solid #dddcd5;border-radius:12px;padding:10px;margin-top:8px}.badge{float:right;background:#e8f0ec;color:#285f50;border-radius:999px;padding:3px 8px;font-size:12px}.tip{background:#fff8e9}.sec{margin-top:17px}.sec h3{font-size:14px}.hidden{display:none!important}</style></head><body><main><h1>煮付けラボ</h1><div class="muted">相性スコア Ver.2／味付け候補 Ver.2／素材37種</div><section class="card"><h2>魚と仕上がり</h2><select id="fish"></select><br><br><select id="mood"><option>おまかせ</option><option>さっぱり</option><option>ご飯に合う</option><option>酒に合う</option><option>甘くない</option><option>こってり</option><option>洋風</option></select></section><section class="card"><h2>一緒に煮る素材</h2><input id="search" type="search" placeholder="素材を絞り込み"><div class="chips" id="chips"></div><p class="muted">複数選択できます。何も選ばず分析するとおすすめ素材を表示します。</p></section><section class="card result" id="result"><div id="out"></div></section></main><div class="bar"><div><button type="button" class="go" id="go">相性を分析</button><button type="button" class="clear" id="clear">クリア</button></div></div><script>
const F={"サバ":[5,5,5,3,8],"ブリ":[5,4,4,4,9],"鯛":[2,3,2,4,8],"タラ":[1,2,2,2,7],"カレイ":[2,3,2,5,8],"金目鯛":[4,4,3,5,9],"鮭":[4,4,3,2,8],"サワラ":[3,3,2,2,7],"アジ":[3,4,4,2,7],"イワシ":[4,5,5,3,6],"サンマ":[5,4,5,2,7],"メカジキ":[3,3,2,1,9],"メバル":[2,4,2,5,9],"カサゴ":[2,4,3,5,9],"ヒラメ":[1,3,1,4,7]};
const V={"大根":[5,3,3,2,1,18,"吸う"],"かぶ":[4,2,4,2,1,10,"淡い"],"茄子":[5,5,2,2,1,9,"脂を吸う"],"白菜":[5,4,4,2,1,8,"甘味"],"玉ねぎ":[3,3,5,3,3,12,"甘味"],"長ねぎ":[3,3,4,2,4,8,"香味"],"じゃがいも":[3,3,3,2,1,16,"ボディ"],"里芋":[4,3,3,2,1,17,"とろみ"],"ごぼう":[3,3,2,3,5,16,"香り"],"れんこん":[3,2,3,2,2,14,"食感"],"冬瓜":[5,2,2,1,1,13,"吸う"],"豆腐":[5,3,1,2,1,5,"吸う"],"厚揚げ":[4,4,1,3,2,7,"コク"],"トマト":[2,2,3,5,4,7,"酸味・旨味"],"しいたけ":[3,2,1,5,4,7,"旨味・香り"],"まいたけ":[3,3,1,5,5,6,"旨味・香り"],"えのき":[4,2,1,4,2,4,"旨味・とろみ"],"しめじ":[3,2,1,4,3,6,"旨味"],"エリンギ":[2,2,1,3,2,8,"食感"],"キャベツ":[4,4,5,2,1,8,"甘味"],"にんじん":[2,2,5,2,2,15,"甘味"],"セロリ":[2,2,2,2,5,8,"香味"],"ピーマン":[3,4,2,2,4,5,"青い香り"],"ズッキーニ":[4,4,2,2,1,7,"吸う"],"ししとう":[2,3,1,1,4,4,"香味"],"たけのこ":[2,2,2,3,3,10,"食感"],"小松菜":[3,3,2,2,2,3,"青菜"],"春菊":[2,2,1,2,5,2,"香り"],"長芋":[3,2,2,2,1,8,"食感"],"こんにゃく":[3,1,0,0,1,12,"食感"],"オクラ":[2,2,1,2,1,3,"とろみ"],"干し椎茸":[4,2,2,5,5,12,"濃い旨味"],"ゴーヤ":[2,2,0,1,5,5,"苦味・青香"],"はんぺん":[4,2,2,3,1,3,"吸う・魚旨味"],"モロヘイヤ":[3,2,1,2,2,2,"とろみ・青菜"],"納豆":[1,1,1,5,5,2,"発酵・旨味"],"キムチ":[2,2,2,4,5,4,"発酵・辛味"]};
const B={"ブリ|大根":97,"鯛|かぶ":95,"サバ|茄子":94,"カレイ|ごぼう":91,"タラ|白菜":91,"タラ|じゃがいも":90,"サバ|トマト":93,"鮭|キャベツ":92,"金目鯛|大根":96,"メバル|豆腐":92,"カサゴ|大根":93,"サワラ|かぶ":91,"アジ|茄子":91,"イワシ|トマト":92,"サンマ|大根":92,"メカジキ|トマト":90,"鯛|冬瓜":93,"鯛|白菜":90,"ブリ|ごぼう":92,"ブリ|里芋":91,"カレイ|豆腐":93,"鮭|じゃがいも":91,"タラ|しめじ":90,"サバ|大根":91,"ヒラメ|かぶ":92};
const FL=[["王道・甘辛醤油","醤油・酒・みりん・砂糖。魚の旨味を受けた煮汁を素材に含ませる基準の味。",5,4,1,1,4,0,5,5,4,3,5],["甘さ控えめ・醤油酒生姜","醤油・酒・生姜を軸に甘味を控え、魚と素材の味を前に出す。",5,5,3,5,2,0,5,1,4,5,4],["生姜強め・甘辛醤油","王道甘辛に生姜を強めに効かせ、脂や青魚の香りを整える。",5,5,2,2,4,0,5,4,5,5,4],["塩・酒・柑橘","魚の出汁を前に出し、最後の酸味で締める。",2,4,5,5,1,2,5,0,3,2,3],["黒酢・生姜・醤油","脂を黒酢で切り、生姜で香りを整える。",5,5,4,4,3,0,4,1,5,5,5],["味噌・生姜","旨味とコクを足し、根菜・豆腐・葉物にも味を渡す。",5,4,1,2,5,0,5,2,4,4,4],["トマト・白だし","酸味と旨味を重ね、魚の脂を軽くまとめる。",3,4,3,4,3,5,2,2,4,3,3],["薄口醤油・昆布・山椒","繊細な白身を壊さず、旨味と香りを補う。",4,5,5,4,2,0,5,1,2,2,4],["白ワイン・玉ねぎ・ハーブ","魚の煮汁を白ワインと香味野菜で洋風に育てる。",1,4,3,4,3,5,0,2,3,2,3]];
const T=[["生姜","魚の香りを整え、煮汁に芯を作る。",4,5,2,3,5,1],["粉山椒","脂の後味を軽くし、甘辛い煮汁に輪郭を出す。",4,3,4,4,5,1],["柚子皮","香りを持ち上げ、重さを残さず余韻を作る。",5,2,5,1,5,2],["大葉","青魚や濃い煮汁に爽やかな青い香りを加える。",3,4,5,1,5,1],["みょうが","甘辛さや脂を軽く感じさせる。",3,4,5,2,5,1],["柚子胡椒","脂とコクを切りつつ柑橘香と辛味を足す。",5,4,4,5,5,1],["黒胡椒","洋風やトマト系に辛味と輪郭を足す。",3,2,2,4,2,5],["花椒","脂の強い魚に痺れと香りを足す。",4,3,3,5,1,1],["唐辛子","甘さや脂に対して辛味の軸を作る。",3,2,2,5,3,2],["クミン","青魚やトマト煮をスパイス方向へ展開する。",3,3,2,2,1,4],["ディル","タラ・鮭・芋系に清涼感を足す。",2,2,5,1,1,5],["タイム","トマトや玉ねぎの洋風煮に奥行きを足す。",2,2,3,1,1,5]];
const fish=document.getElementById("fish"),mood=document.getElementById("mood"),chips=document.getElementById("chips"),result=document.getElementById("result"),out=document.getElementById("out");
Object.keys(F).forEach(n=>fish.insertAdjacentHTML("beforeend",`<option>${n}</option>`));Object.entries(V).forEach(([n,v])=>chips.insertAdjacentHTML("beforeend",`<label class="chip" data-name="${n}"><input type="checkbox" name="veg" value="${n}"><span>${n}<small>${v[6]}</small></span></label>`));
function raw(f,v){return Math.min(98,43+16*f[0]/5*v[1]/5+15*f[1]/5*v[0]/5+8*(6-f[1])/5*v[3]/5+7*f[2]/5*v[2]/5+6*f[3]/5*v[0]/5)}
function sim(a,b,s){let d=0;for(let i=0;i<a.length;i++)d+=((a[i]-b[i])/s[i])**2;return Math.exp(-d/2)}
function score(n){let k=fish.value+"|"+n;if(B[k])return B[k];let f=F[fish.value],v=V[n],r=raw(f,v),q=[];Object.entries(B).forEach(([k,t])=>{let [af,av]=k.split("|"),w=(sim(f,F[af],[4,4,4,4,10])*sim(v.slice(0,6),V[av].slice(0,6),[5,5,5,5,5,18]))**.7;q.push([w,t-raw(F[af],V[av])])});q.sort((a,b)=>b[0]-a[0]);q=q.slice(0,5);let ws=q.reduce((z,x)=>z+x[0],0)||1,c=q.reduce((z,x)=>z+x[0]*x[1],0)/ws;return Math.max(45,Math.min(97,Math.round(r+.75*c)))}
function why(n){let f=F[fish.value],v=V[n],a=[];if(f[0]>=4&&v[1]>=4)a.push(n+"が魚の脂と煮汁を受け止める");if(f[1]>=4&&v[0]>=4)a.push("魚の旨味を"+n+"に含ませやすい");if(f[1]<=2&&v[3]>=4)a.push(n+"から旨味を補える");if(f[3]>=4&&v[0]>=4)a.push("ゼラチン質を含む煮汁を抱え込める");return(a[0]||"煮汁を介して味を一体化しやすい")+"。"}
function fscore(x,f,a){let vs=a.map(n=>V[n]),avg=k=>vs.reduce((z,v)=>z+v[k],0)/vs.length,s=f[0]*x[8]*1.2+f[2]*x[9]+avg(0)*x[10]*.9;if(x[0]==="王道・甘辛醤油")s+=avg(0)*2.5+f[1]*1.6+f[3]*1.2;let m=mood.value,ix={"ご飯に合う":2,"酒に合う":3,"さっぱり":4,"甘くない":5,"こってり":6,"洋風":7}[m];if(ix)s+=x[ix]*(m==="洋風"?7:5);else s+=x[6]*1.2+x[2]*.8;return s}
function flavors(f,a){return FL.map(x=>[x,fscore(x,f,a)]).sort((p,q)=>q[1]-p[1]).slice(0,3).map(x=>x[0])}
function tip(f,fl){return T.map(x=>[x,f[0]*x[2]*1.4+f[2]*x[3]*1.3+(fl[7]>=4?x[5]*2:0)+(fl[6]>=4?x[6]*2:0)]).sort((a,b)=>b[1]-a[1]).slice(0,3)}
function analyze(){try{let a=[...document.querySelectorAll('input[name="veg"]:checked')].map(x=>x.value);if(!a.length)a=Object.keys(V).sort((x,y)=>score(y)-score(x)).slice(0,8);let f=F[fish.value],total=Math.round(a.reduce((s,n)=>s+score(n),0)/a.length),fl=flavors(f,a),tp=tip(f,fl[0]),long=a.filter(n=>V[n][5]>=f[4]+4),short=a.filter(n=>V[n][5]<=f[4]-2);out.innerHTML=`<div class="score">${total} / 100</div><b>${fish.value} × ${a.join(" × ")}</b><div class="sec"><h3>素材ごとの相性</h3>${a.map(n=>`<div class="pair"><span class="badge">${score(n)}点</span><b>${fish.value} × ${n}</b><div class="muted">${why(n)}</div></div>`).join("")}</div><div class="sec"><h3>味付け候補</h3>${fl.map((x,i)=>`<div class="flavor"><b>第${i+1}候補　${x[0]}</b><div class="muted">${x[1]}</div></div>`).join("")}</div><div class="sec"><h3>💡 ワンポイント</h3><div class="tip"><b>${tp[0][0][0]}を仕上げに</b><div>${tp[0][0][1]}</div><div class="muted">別案：${tp[1][0][0]}／${tp[2][0][0]}</div></div></div><div class="sec"><h3>煮る順番</h3>${long.length?`<div class="step"><b>先に煮る</b><div class="muted">${long.join("・")}を先行加熱。</div></div>`:""}<div class="step"><b>魚を入れる</b><div class="muted">約${f[4]}分を目安に、強く沸騰させ続けず煮る。</div></div>${short.length?`<div class="step"><b>後半に加える</b><div class="muted">${short.join("・")}は香りや食感を残す。</div></div>`:""}<div class="step"><b>魚を先に取り出す</b><div class="muted">魚の火入れを止め、素材と煮汁だけを仕上げる。</div></div></div>`;result.classList.add("show");result.scrollIntoView(true)}catch(e){result.classList.add("show");out.innerHTML=`<div class="tip"><b>分析エラー</b><div>${e.message}</div></div>`}}
document.getElementById("go").onclick=analyze;document.getElementById("clear").onclick=()=>{document.querySelectorAll('input[name="veg"]').forEach(x=>x.checked=false);result.classList.remove("show")};document.getElementById("search").oninput=e=>document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("hidden",!x.textContent.includes(e.target.value)));
</script></body></html>
